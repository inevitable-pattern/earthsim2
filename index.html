<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth History Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#scale-root{width:940px;height:640px;transform-origin:center center;position:relative}
#wrap{display:flex;gap:0;width:940px;height:640px;background:#000;font-family:'Courier New',monospace}
#left{width:484px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:8px;gap:4px;position:relative}
#top-row{display:flex;align-items:center;gap:6px;width:100%;justify-content:center}
#title-logo{height:18px;width:18px;flex-shrink:0;border-radius:50%}
#era-badge{font-size:13px;color:#ffec27;letter-spacing:1px;text-align:center;font-weight:bold;flex:1}
#lang-btn{font-family:'Courier New',monospace;font-size:9px;padding:2px 7px;background:#0a1628;color:#ffec27;border:1px solid #ffec27;cursor:pointer;flex-shrink:0}
#lang-btn:hover{background:#1a3a5c}
#eon-badge{font-size:9px;color:#7ec8e3;text-align:center;min-height:14px}
#macro-wrap{position:relative;width:440px;height:401px;border:2px solid #1a3a5c;box-shadow:0 0 0 1px #040e1c inset;background:#000}
canvas#macro{width:440px;height:401px;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:pointer}
#top-row2{position:absolute;top:4px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 6px;pointer-events:none}
#progress-outer{width:100%;height:8px;background:#040e1c;border:1px solid #1a3a5c;position:relative}
#progress-bar{height:100%;background:#1a5276;width:0%}
#progress-label{position:absolute;right:3px;top:0;font-size:7px;color:#4a7c9e;line-height:8px}
#year-display{font-size:9px;color:#4a7c9e;text-align:center}
#event-log{width:100%;font-size:8px;color:#ffa07a;min-height:24px;text-align:center;line-height:1.4;padding:2px 4px;background:#040e1c;border:1px solid #1a3a5c}
#btns{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.ebtn{font-family:'Courier New',monospace;font-size:9px;padding:3px 7px;background:#0a1628;color:#7ec8e3;border:1px solid #1a3a5c;cursor:pointer}
.ebtn:hover{background:#1a3a5c;color:#fff}
#speed-row{display:flex;align-items:center;gap:4px;font-size:9px;color:#7ec8e3;flex-wrap:wrap;justify-content:center}
#speed-row button{font-family:'Courier New',monospace;font-size:9px;padding:2px 7px;background:#0a1628;color:#aaa;border:1px solid #1a3a5c;cursor:pointer}
#speed-row button.active{background:#1a5276;color:#ffec27;border-color:#ffec27}
#right{flex:1;display:flex;flex-direction:column;overflow:hidden;border-left:1px solid #1a3a5c}
.panel{padding:5px 10px;border-bottom:1px solid #0d2137}
.ptitle{font-size:8px;color:#4a7c9e;letter-spacing:2px;margin-bottom:3px;display:flex;align-items:center;justify-content:space-between}
#atmo-head{display:flex;align-items:center;gap:8px}
#planet-wrap{position:relative;width:52px;height:52px;flex-shrink:0}
canvas#planet-icon{width:52px;height:52px;border-radius:50%;display:block}
#worldmap-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#04101c;border:1px solid #0d2137;padding:4px}
#companion-panel{width:118px;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
#companion-head{display:flex;justify-content:space-between;align-items:flex-start;gap:2px}
#companion-avatar-wrap{width:48px;height:48px;background:#04101c;border:1px solid #0d2137;flex-shrink:0}
#companion-switcher{display:flex;flex-direction:column;gap:2px}
.char-btn{font-size:9px;line-height:1;background:#071525;border:1px solid #0d2137;color:#4a7c9e;padding:2px 3px;cursor:pointer}
.char-btn:hover{border-color:#4a7c9e}
.char-btn.active{border-color:#ffec27;background:#0d2137}
#companion-name{font-size:7px;color:#4a7c9e;letter-spacing:1px}
#companion-bubble{position:relative;background:#000;border:1px solid #1a3a5c;padding:5px 6px;min-height:40px;font-family:'Courier New',monospace;font-size:7px;color:#4ecb71;cursor:pointer;line-height:1.5;box-shadow:0 0 6px rgba(78,203,113,0.2) inset;word-break:break-word}
#companion-cursor{display:inline-block;visibility:hidden;color:#4ecb71;animation:blink-cursor 0.9s steps(1) infinite}
@keyframes blink-cursor{50%{opacity:0}}
canvas#world-map{width:100%;max-width:220px;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#tabbed-panel{flex:1;display:flex;flex-direction:column;min-height:0;padding:5px 10px 0}
#tab-buttons{display:flex;gap:2px;margin-bottom:4px;flex-shrink:0}
.tab-btn{flex:1;font-family:'Courier New',monospace;font-size:8px;letter-spacing:1px;padding:4px 2px;background:#071525;color:#4a7c9e;border:1px solid #0d2137;cursor:pointer}
.tab-btn:hover{background:#0d2137;color:#7ec8e3}
.tab-btn.active{background:#1a3a5c;color:#ffec27;border-color:#ffec27}
#tab-content{flex:1;overflow-y:auto;padding-bottom:5px}
.tab-pane{width:100%}
.gas-row{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.gas-label{font-size:8px;color:#7ec8e3;width:118px;white-space:nowrap;overflow:hidden}
.bar-bg{flex:1;height:5px;background:#071525}
.bar-fill{height:5px}
.gas-val{font-size:9px;width:40px;text-align:right}
.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.ec{background:#071525;padding:3px 5px;border:1px solid #0d2137}
.climate-card{flex:1;background:#071525;border:1px solid #0d2137;padding:4px 6px}
.climate-card-title{font-size:7px;color:#4a7c9e;letter-spacing:1px;margin-bottom:3px}
.climate-item{font-size:8px;line-height:1.3;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px;white-space:nowrap}
.climate-item:last-child{margin-bottom:0}
.ci-icon{font-size:9px;display:inline-block;width:12px;text-align:center;flex-shrink:0}
.ci-label{display:flex;align-items:center;gap:2px}
.ec-label{font-size:7px;color:#4a7c9e;letter-spacing:1px}
.ec-val{font-size:9px;font-weight:bold;color:#7ec8e3}
.bio-group{margin-bottom:8px}
.bio-group-title{font-size:7px;color:#4a7c9e;letter-spacing:1px;margin-bottom:3px;border-bottom:1px solid #0d2137;padding-bottom:1px}
.bio-cols{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.bio-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:20px}
.bio-col-barbg{width:9px;height:22px;background:#000;border:1px solid #0d2137;display:flex;align-items:flex-end}
.bio-col-barfill{width:100%}
.bio-col-icon{font-size:10px;margin-top:2px}
.bio-col-name{writing-mode:vertical-rl;text-orientation:mixed;font-size:6px;color:#7ec8e3;margin-top:2px;height:46px;letter-spacing:0.5px}
.log-entry{display:flex;gap:6px;font-size:7px;padding:2px 0;border-bottom:1px solid #071525}
.log-entry .log-mya{color:#4a7c9e;flex-shrink:0;white-space:nowrap}
.log-entry .log-text{color:#7ec8e3}
.bio-cat-row{display:flex;flex-wrap:wrap;gap:5px}
.bio-col{display:flex;flex-direction:column;align-items:center;width:20px}
.bio-col-bar-wrap{height:28px;width:9px;display:flex;align-items:flex-end;background:#000;border:1px solid #0d2137}
.bio-col-bar-fill{width:100%}
.bio-col-icon{font-size:10px;margin-top:2px;line-height:1}
.bio-col-name{writing-mode:vertical-rl;text-orientation:mixed;font-size:6.5px;color:#7ec8e3;margin-top:2px;letter-spacing:0.5px;max-height:56px;overflow:hidden}
#timeline{padding:4px 6px 4px;background:#040e1c;border-top:1px solid #0d2137;overflow-x:auto;flex-shrink:0}
#timeline::-webkit-scrollbar{height:4px;background:#040e1c}
#timeline::-webkit-scrollbar-thumb{background:#1a3a5c;border-radius:2px}
.tl-inner{display:flex;gap:2px;align-items:flex-end;width:max-content;padding-bottom:2px}
.tl-era{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:3px 4px;border-radius:2px;flex-shrink:0}
.tl-era:hover{background:#0d2137}
.tl-era.active{background:#1a3a5c}
.tl-dot{width:8px;height:8px;border-radius:50%;margin-bottom:3px;flex-shrink:0}
.tl-name{font-size:9px;color:#4a7c9e;text-align:center;writing-mode:vertical-lr;height:60px;line-height:1.2;overflow:hidden;letter-spacing:1px}
.tl-era.active .tl-name{color:#ffec27}
</style>
</head>

// ---- 自動スケール ----
function autoScale(){
  const root=document.getElementById('scale-root');
  const W=940,H=640;
  const scaleX=window.innerWidth/W;
  const scaleY=window.innerHeight/H;
  const scale=Math.min(scaleX,scaleY)*0.98;
  root.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',autoScale);
autoScale();

// ---- タブ切り替え ----
let activeTab='climate';
function setTab(tab){
  activeTab=tab;
  ['climate','bio','ocean','crust','log'].forEach(t=>{
    const pane=document.getElementById('tab-'+t),btn=document.getElementById('tab-btn-'+t);
    if(pane)pane.style.display=(t===tab)?'block':'none';
    if(btn)btn.classList.toggle('active',t===tab);
  });
}
// clicking the macro cross-section jumps to the related tab: sky->climate, land/sea->biosphere, underground->crust
document.getElementById('macro').addEventListener('click',(ev)=>{
  const rect=ev.currentTarget.getBoundingClientRect();
  const relY=(ev.clientY-rect.top)/rect.height;
  const iy=relY*MH;
  if(iy<LAND_TOP) setTab('climate');
  else if(iy<FLOOR_BOT) setTab('bio');
  else setTab('crust');
});

let currentChar='ark',dialogueIndex=0;

let typeTimer=0;
const cav=document.getElementById('companion-avatar'),cactx=cav.getContext('2d');
const spv=document.getElementById('surface-pie'),spctx=spv.getContext('2d');
function drawSurfacePie(items){
  const s=70,cx=35,cy=35,r=30;
  spctx.clearRect(0,0,s,s);
  const total=items.reduce((a,x)=>a+Math.max(0,x.v),0)||1;
  let ang=-Math.PI/2;
  items.forEach(x=>{
    if(x.v<=0.05)return;
    const slice=(x.v/total)*Math.PI*2;
    spctx.beginPath();spctx.moveTo(cx,cy);spctx.arc(cx,cy,r,ang,ang+slice);spctx.closePath();
    spctx.fillStyle=x.color;spctx.fill();
    const midAng=ang+slice/2,labelR=r*0.65;
    if(slice>0.35){
      spctx.fillStyle='#04101c';
      spctx.font='8px monospace';spctx.textAlign='center';spctx.textBaseline='middle';
      spctx.fillText(Math.round(x.v)+'%',cx+Math.cos(midAng)*labelR,cy+Math.sin(midAng)*labelR);
    }
    ang+=slice;
  });
  spctx.beginPath();spctx.arc(cx,cy,r,0,Math.PI*2);spctx.strokeStyle='#0d2137';spctx.lineWidth=1.5;spctx.stroke();
}
function startTyping(text){
  typingState={text:'',target:text,charIndex:0,done:false};
  typeTimer=0;
  const te=document.getElementById('companion-text');if(te)te.textContent='';
  const cu=document.getElementById('companion-cursor');if(cu)cu.style.visibility='hidden';
}
function typewriterTick(ds){
  if(typingState.done)return;
  typeTimer+=ds;
  const interval=0.045;
  while(typeTimer>=interval && typingState.charIndex<typingState.target.length){
    typeTimer-=interval;typingState.charIndex++;
  }
  typingState.text=typingState.target.slice(0,typingState.charIndex);
  const te=document.getElementById('companion-text');if(te)te.textContent=typingState.text;
  if(typingState.charIndex>=typingState.target.length){
    typingState.done=true;
    const cu=document.getElementById('companion-cursor');if(cu)cu.style.visibility='visible';
  }
}
function advanceDialogue(){
  if(!typingState.done){
    typingState.charIndex=typingState.target.length;
    typingState.text=typingState.target;typingState.done=true;
    const te=document.getElementById('companion-text');if(te)te.textContent=typingState.text;
    const cu=document.getElementById('companion-cursor');if(cu)cu.style.visibility='visible';
    return;
  }
  const lines=COMPANIONS[currentChar].lines[lang];
  dialogueIndex=(dialogueIndex+1)%lines.length;
  startTyping(lines[dialogueIndex]);
}
function switchCharacter(name){
  if(!COMPANIONS[name])return;
  currentChar=name;dialogueIndex=0;
  startTyping(COMPANIONS[name].lines[lang][0]);
  const nameEl=document.getElementById('companion-name');if(nameEl)nameEl.textContent=COMPANIONS[name].name;
  document.querySelectorAll('.char-btn').forEach(b=>b.classList.toggle('active',b.dataset.char===name));
}
function drawCompanionAvatar(t){
  cactx.clearRect(0,0,48,48);
  COMPANIONS[currentChar].draw(cactx,24,27,t);
}

// Estimated plate-tectonic activity per era (1-5), plus a broad regime type used to emphasize which
// of the sub-processes (volcanism / mountain-building / seafloor spreading / subduction / drift) is
// most active for that era. These are illustrative design estimates, not precise measurements.
const PLATE_TECTONICS={
  hadean:{activity:5,type:'chaotic'}, archean:{activity:5,type:'chaotic'},
  proterozoic:{activity:4,type:'growth'}, snowball:{activity:3,type:'stable'},
  ediacaran:{activity:3,type:'assembly'}, cambrian:{activity:4,type:'spreading'},
  ordovician:{activity:4,type:'orogeny'}, silurian:{activity:3,type:'stable'},
  devonian:{activity:4,type:'orogeny'}, carboniferous:{activity:4,type:'assembly'},
  permian:{activity:3,type:'stable'}, pt_ext:{activity:4,type:'flood_volcanism'},
  triassic_e:{activity:3,type:'stable'}, triassic_l:{activity:3,type:'breakup'},
  jurassic_e:{activity:4,type:'breakup'}, jurassic_l:{activity:4,type:'breakup'},
  cretaceous_e:{activity:5,type:'spreading'}, cretaceous_l:{activity:5,type:'spreading'},
  kpg_ext:{activity:4,type:'flood_volcanism'}, paleogene:{activity:4,type:'orogeny'},
  neogene:{activity:4,type:'orogeny'}, quaternary:{activity:3,type:'stable'},
};
function deriveTectonics(eraId){
  const pt=PLATE_TECTONICS[eraId]||PLATE_TECTONICS.quaternary;
  const b=pt.activity;
  let volcanic=b,mountain=b,seafloor=b,subduction=b,drift=b;
  const cap=v=>Math.min(5,v);
  switch(pt.type){
    case 'chaotic': volcanic=5;seafloor=5;subduction=5;drift=5;break;
    case 'growth': mountain=cap(b+1);drift=cap(b+1);break;
    case 'assembly': subduction=cap(b+1);drift=cap(b+1);mountain=cap(b+1);break;
    case 'breakup': seafloor=cap(b+1);drift=cap(b+1);volcanic=cap(b+1);break;
    case 'orogeny': mountain=cap(b+1);subduction=cap(b+1);break;
    case 'spreading': seafloor=cap(b+1);break;
    case 'flood_volcanism': volcanic=5;break;
    case 'stable': break;
  }
  return {activity:b,volcanic,mountain,seafloor,subduction,drift,type:pt.type};
}

 {key:'N2',label:'N₂',color:'#7ec8e3',name:{en:'Nitrogen',ja:'窒素'}},

const TOTAL_MYA=4500,REAL_SECONDS_1X=300*60,MYA_PER_SEC_1X=TOTAL_MYA/REAL_SECONDS_1X;
let simMya=TOTAL_MYA,spd=1,state={},offset={},lastEraIdx=-1,curEraIdx=0,lastTimestamp=null;
let ashLevel=0,impactFlash=0,lightningFlash=0,lightningTimer=0;

// Macro cross-section canvas coordinate space (160x136)
const MW=160,MH=146;
const SKY_TOP=2,SKY_BOT=62,LAND_TOP=62,LAND_BASE=86,SEA_TOP=86,SEA_BOT=114,FLOOR_TOP=114,FLOOR_BOT=122,SUB_TOP=122,SUB_BOT=134,MANTLE_TOP=134,MANTLE_BOT=146;
let meteorActive=false,meteorX=0,meteorY=0,meteorVY=0;
let volcanoActive=0,craterMark=0,craterX=MW/2;
let quakeActive=0,typhoonActive=0;
let meteorAmbientTimer=8;
let clockT=0; // real-time seconds accumulator, drives visual-only cycles (day/night, waves, wind)

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function windRatio(){return clamp((state.surface.windAvg||10)/15,0.15,14);} // 15 m/s ~= calm-Phanerozoic baseline
function getEraIdx(mya){for(let i=0;i<ERAS.length;i++){if(mya<=ERAS[i].mya&&mya>ERAS[i].endMya)return i;}return ERAS.length-1;}
function initOffset(){const bio={};bioKeys().forEach(k=>bio[k]=0);offset={temp:0,co2:0,o2:0,iceRatio:0,windAvg:0,humidity:0,pressureAtm:0,bio};}
function initState(eIdx){
  const e=ERAS[eIdx||0];const bio={};bioKeys().forEach(k=>bio[k]=e.bio[k]||0);
  const sf=e.surface||ERA_SURFACE.hadean;
  const cl=ERA_CLIMATE[e.id]||ERA_CLIMATE.hadean;
  const mid=r=>(r[0]+r[1])/2;
  state={atmo:{...e.atmo},temp:mid(cl.temp),
    surface:{magma:sf.magma,ocean:sf.ocean,land:sf.land,ice:sf.ice,windAvg:mid(cl.windAvg),windMax:mid(cl.windMax)},
    humidityPct:mid(cl.humidity),pressureAtm:mid(cl.pressureAtm),
    clouds:e.clouds,snowball:e.snowball,gc:e.gc,bio};
}
function naturalVar(seed){
  const fast=Math.sin(clockT*1.1 +seed*3.1)*0.14;   // ~6s ripple — visible tick every couple seconds
  const med =Math.sin(clockT*0.16+seed)*0.28;       // ~40s swing
  const slow=Math.sin(clockT*0.024+seed*1.7)*0.38;  // ~260s longer drift
  return clamp(0.5+fast+med+slow,0,1);
}

function updateSim(ds){
  if(spd===0) return; // literal pause: nothing moves, nothing decays, nothing progresses
  clockT+=ds;
  ashLevel=Math.max(0,ashLevel-ds/8);
  impactFlash=Math.max(0,impactFlash-ds/1.2);
  lightningFlash=Math.max(0,lightningFlash-ds*6);
  volcanoActive=Math.max(0,volcanoActive-ds/10);
  craterMark=Math.max(0,craterMark-ds/14);
  quakeActive=Math.max(0,quakeActive-ds/6);
  typhoonActive=Math.max(0,typhoonActive-ds/16);

  simMya-=MYA_PER_SEC_1X*spd*ds;
  if(simMya<0)simMya=0; // present day reached — keep simulating indefinitely, no stop/ending

  const eIdx=getEraIdx(simMya);curEraIdx=eIdx;const e=ERAS[eIdx];
  const eraDurSec=(e.mya-e.endMya)/(MYA_PER_SEC_1X*spd);
  const tau=Math.max(eraDurSec*0.18,0.8);
  const blend=clamp(1-Math.exp(-ds/tau),0,0.4);
  Object.keys(e.atmo).forEach(k=>state.atmo[k]=lerp(state.atmo[k]||0,e.atmo[k],blend));
  state.atmo.CO2=clamp(state.atmo.CO2+offset.co2*0.01,0,90);
  state.atmo.O2=clamp(state.atmo.O2+offset.o2*0.01,0,40);
  const sf=e.surface||ERA_SURFACE.hadean;
  state.surface.magma =lerp(state.surface.magma, sf.magma, blend);
  const targetIce=clamp(sf.ice+offset.iceRatio*100,0,100);
  const iceDelta=targetIce-sf.ice;
  state.surface.ice   =lerp(state.surface.ice,   targetIce, blend);
  state.surface.ocean =lerp(state.surface.ocean, clamp(sf.ocean-iceDelta*0.7,0,100), blend);
  state.surface.land  =lerp(state.surface.land,  clamp(sf.land -iceDelta*0.3,0,100), blend);
  state.clouds=lerp(state.clouds,e.clouds,blend);
  state.gc=e.gc;
  bioKeys().forEach(k=>{const tgt=clamp((e.bio[k]||0)+(offset.bio[k]||0),0,100);state.bio[k]=lerp(state.bio[k]||0,tgt,blend);});

  // Weather/climate: continuously varies within this era's estimated real-world range (situational
  // fluctuation), tracked on a fast real-time constant so it feels alive regardless of sim speed —
  // separate from the slow evolutionary `blend` used for atmosphere/biosphere above.
  const cl=ERA_CLIMATE[e.id]||ERA_CLIMATE.hadean;
  const cTau=2.2,cBlend=clamp(1-Math.exp(-ds/cTau),0,1);
  const phase=eIdx*0.37;
  const tempTarget=lerp(cl.temp[0],cl.temp[1],naturalVar(1.1+phase))+offset.temp;
  state.temp=lerp(state.temp,tempTarget,cBlend);
  const windAvgTarget=lerp(cl.windAvg[0],cl.windAvg[1],naturalVar(2.7+phase))+offset.windAvg;
  state.surface.windAvg=lerp(state.surface.windAvg,Math.max(0,windAvgTarget),cBlend);
  const windMaxTarget=lerp(cl.windMax[0],cl.windMax[1],naturalVar(3.9+phase))+offset.windAvg*2.4;
  state.surface.windMax=lerp(state.surface.windMax,Math.max(state.surface.windAvg,windMaxTarget),cBlend);
  const humidityTarget=clamp(lerp(cl.humidity[0],cl.humidity[1],naturalVar(4.4+phase))+offset.humidity,0,100);
  state.humidityPct=lerp(state.humidityPct,humidityTarget,cBlend);
  const pressureTarget=Math.max(0.1,lerp(cl.pressureAtm[0],cl.pressureAtm[1],naturalVar(5.6+phase))+offset.pressureAtm);
  state.pressureAtm=lerp(state.pressureAtm,pressureTarget,cBlend);
  state.snowball=e.snowball||(state.surface.ice>80);

  const df=Math.exp(-ds/90);
  offset.temp*=df;offset.co2*=df;offset.o2*=df;offset.iceRatio*=df;
  bioKeys().forEach(k=>offset.bio[k]*=df);
  const dfWeather=Math.exp(-ds/25); // storm-like event effects on wind/humidity/pressure pass faster
  offset.windAvg*=dfWeather;offset.humidity*=dfWeather;offset.pressureAtm*=dfWeather;

  // ambient ash from high volcanism — scaled by the era's plate-tectonics volcanic-activity rating
  const tecVolc=deriveTectonics(e.id).volcanic;
  if(state.surface.magma>15 || tecVolc>=5) ashLevel=Math.max(ashLevel,Math.min(0.6,(state.surface.magma+tecVolc*8)/150));

  // ambient lightning during humid/stormy conditions — heavily volcanic eras (Hadean) get frequent storms
  lightningTimer-=ds;
  const h2ofAmb=clamp((state.atmo.H2O||0)/8,0,1);
  const stormFactor=clamp(h2ofAmb+(state.surface.magma/70)+(tecVolc-2)*0.12,0,1.8);
  if(lightningTimer<=0){
    lightningTimer=Math.max(0.5,(2+Math.random()*6)/(1+stormFactor));
    if(stormFactor>0.3 && Math.random()<stormFactor) lightningFlash=1;
  }

  // ambient meteor showers — Hadean Earth was under near-constant bombardment
  meteorAmbientTimer-=ds;
  if(e.id==='hadean' && !meteorActive && meteorAmbientTimer<=0){
    meteorAmbientTimer=5+Math.random()*8;
    meteorActive=true;meteorX=20+Math.random()*(MW-40);meteorY=SKY_TOP;meteorVY=1.6+Math.random()*0.8;
  }

  updateMeteor(ds);
  updateRain(ds);

  if(eIdx!==lastEraIdx){
    lastEraIdx=eIdx;
    setEvent(e.desc[lang]||e.desc.en);
    document.getElementById('eon-badge').textContent=(e.name[lang]||e.name.en).toUpperCase()+' — '+(e.mya>=1000?(e.mya/1000).toFixed(1)+(lang==='ja'?'十億年前':' BYA'):e.mya+(lang==='ja'?'百万年前':' MYA'));
    updateTimeline(eIdx);
  }
}

function initRainDrops(){
  rainDrops=[];
  for(let i=0;i<32;i++){
    rainDrops.push({
      x:Math.random()*MW,
      y:SKY_TOP+Math.random()*(LAND_BASE-SKY_TOP),
      landY:LAND_TOP+Math.random()*(LAND_BASE-LAND_TOP), // lands at a random depth across the whole land, not always the land-sea line
      speed:26+Math.random()*22,
      seed:Math.random()*10
    });
  }
}
function updateRain(ds){
  if(!rainDrops.length) initRainDrops();
  const h2ofNow=clamp((state.atmo.H2O||0)/8,0,1);
  const active = state.temp<2 || h2ofNow>0.45;
  if(!active) return;
  const isSnow = state.temp<2;
  rainDrops.forEach(d=>{
    d.y+=d.speed*(isSnow?0.35:1)*ds;
    if(d.y>=d.landY){
      d.y=SKY_TOP+Math.random()*8;
      d.x=Math.random()*MW;
      d.landY=LAND_TOP+Math.random()*(LAND_BASE-LAND_TOP);
      d.speed=26+Math.random()*22;
    }
  });
}

function updateMeteor(ds){
  if(meteorActive){
    meteorY+=meteorVY*ds*60;
    if(meteorY>=LAND_BASE){
      meteorActive=false;
      impactFlash=1;
      ashLevel=1;
      craterMark=1;
      craterX=meteorX;
    }
  }
}

function doEvent(type){
  if(type==='meteor'){meteorActive=true;meteorX=20+Math.random()*(MW-40);meteorY=SKY_TOP;meteorVY=1.6+Math.random()*0.8;offset.temp+=25;offset.co2+=18;offset.windAvg+=45;offset.humidity-=15;offset.pressureAtm+=0.03;bioKeys().forEach(k=>{if(!['bacteria','fungi','archaea','cyanobact'].includes(k))offset.bio[k]-=20;});offset.bio.bacteria+=8;offset.bio.fungi+=10;setEvent(T('ev_meteor'));}
  else if(type==='volcano'){offset.temp+=18;offset.co2+=25;offset.o2-=6;offset.windAvg+=18;offset.humidity+=10;offset.pressureAtm-=0.02;ashLevel=1;volcanoActive=1;setEvent(T('ev_volcano'));}
  else if(type==='ice'){offset.temp-=35;offset.iceRatio+=0.7;offset.windAvg+=22;offset.humidity-=20;offset.pressureAtm+=0.05;bioKeys().forEach(k=>{if(!['bacteria','archaea','cyanobact'].includes(k))offset.bio[k]-=15;});setEvent(T('ev_ice'));}
  else if(type==='warm'){offset.temp+=25;offset.co2+=12;offset.iceRatio-=0.5;offset.windAvg-=4;offset.humidity+=15;offset.pressureAtm-=0.03;setEvent(T('ev_warm'));}
  else if(type==='mass_ext'){bioKeys().forEach(k=>{if(!['bacteria','fungi','archaea','cyanobact'].includes(k))offset.bio[k]-=45;});offset.bio.bacteria+=15;offset.bio.fungi+=20;offset.temp+=12;offset.windAvg+=25;offset.humidity-=10;impactFlash=0.6;setEvent(T('ev_ext'));}
  else if(type==='earthquake'){quakeActive=1;ashLevel=Math.max(ashLevel,0.35);offset.windAvg+=6;setEvent(T('ev_quake'));}
  else if(type==='typhoon'){typhoonActive=1;offset.windAvg+=65;offset.humidity+=30;offset.pressureAtm-=0.04;setEvent(T('ev_typhoon'));}
}

let audioCtx=null,musicOn=false,musicNodes=null;
function toggleMusic(){
  musicOn=!musicOn;
  const btn=document.getElementById('btn-music');
  if(musicOn){startMusic();if(btn)btn.textContent='🎵 ON';}
  else{stopMusic();if(btn)btn.textContent='🎵 OFF';}
}
function startMusic(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const master=audioCtx.createGain();master.gain.value=0.045;master.connect(audioCtx.destination);
    const freqs=[110,146.83,164.81,220];
    const oscs=freqs.map((f,i)=>{
      const osc=audioCtx.createOscillator();osc.type='sine';osc.frequency.value=f;
      const g=audioCtx.createGain();g.gain.value=0.5/(i+1);
      osc.connect(g);g.connect(master);osc.start();
      return osc;
    });
    const lfo=audioCtx.createOscillator();lfo.frequency.value=0.06;
    const lfoGain=audioCtx.createGain();lfoGain.gain.value=0.018;
    lfo.connect(lfoGain);lfoGain.connect(master.gain);lfo.start();
    musicNodes={master,oscs,lfo};
  }catch(e){}
}
function stopMusic(){
  if(musicNodes){
    musicNodes.oscs.forEach(o=>{try{o.stop();}catch(e){}});
    try{musicNodes.lfo.stop();}catch(e){}
    musicNodes=null;
  }
}

// ---- color helpers ----
function hexToRgb(hex){const n=parseInt(hex.replace('#',''),16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function rgbToCss(c,a){return a===undefined?`rgb(${c.r|0},${c.g|0},${c.b|0})`:`rgba(${c.r|0},${c.g|0},${c.b|0},${a})`;}
function mixC(a,b,t){return{r:lerp(a.r,b.r,t),g:lerp(a.g,b.g,t),b:lerp(a.b,b.b,t)};}
function scaleC(c,f){return{r:clamp(c.r*f,0,255),g:clamp(c.g*f,0,255),b:clamp(c.b*f,0,255)};}
function lighten(hex,a){const n=parseInt(hex.replace('#',''),16);return `rgb(${Math.min(255,((n>>16)&255)+a)},${Math.min(255,((n>>8)&255)+a)},${Math.min(255,(n&255)+a)})`;}
function darken(hex,a){const n=parseInt(hex.replace('#',''),16);return `rgb(${Math.max(0,((n>>16)&255)-a)},${Math.max(0,((n>>8)&255)-a)},${Math.max(0,(n&255)-a)})`;}

// ---- World map: bitmap-style continents that drift over deep time (plate tectonics), with a
// climate overlay so it reads as the same planet as the left cross-section, just zoomed out ----
const wmv=document.getElementById('world-map'),wmctx=wmv.getContext('2d');
wmctx.imageSmoothingEnabled=false;
const WM_W=64,WM_H=32,WM_CENTER={x:32,y:16};
// scattered "modern-day-like" blob positions; they converge toward the center (Pangaea) near the
// Permian-Triassic boundary, then drift back apart — a simplified, stylized plate-tectonics cycle.
// Each blob carries a small persistent cluster of offset sub-circles so its coastline reads as an
// organic continent/peninsula shape rather than a perfect circle.
const worldBlobs=[{sx:12,sy:9},{sx:24,sy:7},{sx:36,sy:15},{sx:50,sy:9},{sx:18,sy:22},{sx:44,sy:23},{sx:56,sy:19}].map(b=>{
  b.parts=[];
  const n=3+Math.floor(Math.random()*2);
  for(let i=0;i<n;i++)b.parts.push({dx:(Math.random()-0.5)*3,dy:(Math.random()-0.5)*2.4,rf:0.22+Math.random()*0.28});
  return b;
});
const wmIslands=[];for(let i=0;i<10;i++)wmIslands.push({x:Math.random()*WM_W,y:Math.random()*WM_H,seed:Math.random()*10});
const wmClouds=[];for(let i=0;i<10;i++)wmClouds.push({
  x:Math.random(),y:2+Math.random()*(WM_H-4),seed:Math.random()*10,life:Math.random(),lifeSpeed:0.006+Math.random()*0.006,
  parts:[{dx:-2,dy:0,r:1.6,ph:Math.random()*6},{dx:0.5,dy:-0.6,r:1.3,ph:Math.random()*6},{dx:2,dy:0.4,r:1.4,ph:Math.random()*6}]
});
let pangaeaSmooth=0.3,pangaeaSmoothInit=false;

function drawWorldMap(t){
  wmctx.clearRect(0,0,WM_W,WM_H);
  const magmaF=clamp((state.surface.magma||0)/55,0,1);
  const iceR=state.surface.ice/100;
  const tecWM=deriveTectonics(ERAS[curEraIdx].id);

  let oceanCol=hexToRgb('#1a5276');
  oceanCol=mixC(oceanCol,hexToRgb('#c0392b'),magmaF);
  if(state.snowball||iceR>0.6) oceanCol=mixC(oceanCol,hexToRgb('#eaf4fb'),0.85);
  wmctx.fillStyle=rgbToCss(oceanCol);
  wmctx.fillRect(0,0,WM_W,WM_H);

  // land color follows the same land-cover breakdown as the SURFACE card (same planet, different scale)
  const biomeWM=computeLandBiome();
  let landCol;
  if(biomeWM==='snow') landCol=hexToRgb('#eef6fb');
  else {
    const lc=computeLandComposition();
    const wForest=hexToRgb('#1e6b32'),wGrass=hexToRgb('#7ea83c'),wSavanna=hexToRgb('#c9a04e'),wDesert=hexToRgb('#c99a52'),wBarren=hexToRgb('#4a3a2c');
    const tot=(lc.forest+lc.grassland+lc.savanna+lc.desert+lc.barren)||1;
    landCol={
      r:(wForest.r*lc.forest+wGrass.r*lc.grassland+wSavanna.r*lc.savanna+wDesert.r*lc.desert+wBarren.r*lc.barren)/tot,
      g:(wForest.g*lc.forest+wGrass.g*lc.grassland+wSavanna.g*lc.savanna+wDesert.g*lc.desert+wBarren.g*lc.barren)/tot,
      b:(wForest.b*lc.forest+wGrass.b*lc.grassland+wSavanna.b*lc.savanna+wDesert.b*lc.desert+wBarren.b*lc.barren)/tot,
    };
  }
  if(magmaF>0.3) landCol=mixC(landCol,hexToRgb('#c0392b'),magmaF*0.7);
  wmctx.fillStyle=rgbToCss(landCol);

  const pangaeaTarget=clamp(1-Math.abs(simMya-252)/500,0,1);
  if(!pangaeaSmoothInit){pangaeaSmooth=pangaeaTarget;pangaeaSmoothInit=true;}
  const driftRate=0.008+tecWM.drift*0.006; // higher continental-drift rating -> visibly faster movement
  pangaeaSmooth=lerp(pangaeaSmooth,pangaeaTarget,driftRate);
  const pangaeaFactor=pangaeaSmooth;
  // land% is reflected by BOTH how many "continent slots" are active AND their size — at low land%
  // only a couple of small landmasses show; at high land% more of the fixed slots activate. This
  // avoids blobs fusing into one oversized mass regardless of the intended percentage.
  const landPct=clamp((state.surface.land||30)/100,0.02,1);
  const activeBlobCount=Math.max(1,Math.min(worldBlobs.length,Math.round(landPct*worldBlobs.length)+1));
  const blobR=clamp(2+landPct*3.4,1.8,6.2);
  const blobCenters=[];
  worldBlobs.forEach((b,i)=>{
    if(i>=activeBlobCount)return;
    const mx=lerp(b.sx,WM_CENTER.x+(i-3)*2.6,pangaeaFactor);
    const my=lerp(b.sy,WM_CENTER.y+Math.sin(i*2)*3,pangaeaFactor);
    // organic cluster of offset circles instead of one perfect circle
    wmctx.beginPath();wmctx.arc(mx,my,blobR,0,Math.PI*2);wmctx.fill();
    b.parts.forEach(p=>{wmctx.beginPath();wmctx.arc(mx+p.dx*(blobR/4),my+p.dy*(blobR/4),blobR*p.rf,0,Math.PI*2);wmctx.fill();});
    blobCenters.push({mx,my,r:blobR});
  });

  // islands / island arcs — more numerous when seafloor spreading is highly active (new volcanic crust)
  const islandCount=Math.round(1+tecWM.seafloor*1.4);
  wmctx.fillStyle=rgbToCss(mixC(landCol,hexToRgb('#3a2c22'),0.15));
  for(let i=0;i<islandCount && i<wmIslands.length;i++){
    const isl=wmIslands[i];
    const nearest=blobCenters[i%blobCenters.length]||{mx:WM_CENTER.x,my:WM_CENTER.y,r:4};
    const ix=nearest.mx+Math.cos(isl.seed)*(nearest.r+3+ (isl.x%6)),iy=nearest.my+Math.sin(isl.seed)*(nearest.r+2+(isl.y%4));
    wmctx.beginPath();wmctx.arc(ix,iy,0.8,0,Math.PI*2);wmctx.fill();
  }

  // polar ice — always a thin band at the poles regardless of ice% (map-projection convention: high
  // latitudes read as ice-white at a glance), growing thicker as global ice% rises
  if(!state.snowball){
    const iceBand=1.5+iceR*4.5;
    wmctx.fillStyle=`rgba(240,250,255,${clamp(0.55+iceR*0.35,0.55,0.92)})`;
    wmctx.fillRect(0,0,WM_W,iceBand);
    wmctx.fillRect(0,WM_H-iceBand,WM_W,iceBand);
  }

  // cloud overlay — same humidity/wind driving the cross-section's clouds, but far slower (global
  // scale), with each puff fading in, drifting, then dissipating and reforming elsewhere
  const cloudDensityWM=clamp(state.clouds*0.4+(state.humidityPct/100)*0.85,0,1.3);
  const windFactorWM=clamp(windRatio(),0.3,6);
  wmClouds.forEach(c=>{
    c.x=(c.x+0.00009*windFactorWM)%1;
    c.life+=c.lifeSpeed*windFactorWM*0.5;
    if(c.life>=1){c.life=0;c.x=Math.random();c.y=2+Math.random()*(WM_H-4);}
    const fade=c.life<0.15?(c.life/0.15):(c.life>0.8?(1-c.life)/0.2:1);
    wmctx.globalAlpha=clamp(cloudDensityWM*0.55*fade,0,0.7);
    wmctx.fillStyle=magmaF>0.4?'rgba(60,55,50,0.7)':'rgba(240,244,248,0.85)';
    const cx=c.x*WM_W,cy=c.y;
    c.parts.forEach(p=>{
      const rr=p.r*(0.8+0.25*Math.sin(t*0.6+p.ph));
      wmctx.beginPath();wmctx.ellipse(cx+p.dx,cy+p.dy,rr,rr*0.6,0,0,Math.PI*2);wmctx.fill();
    });
    wmctx.globalAlpha=1;
  });

  // rain/snow tint
  const precipWM=state.temp<2?'snow':(clamp((state.atmo.H2O||0)/8,0,1)>0.45?'rain':'none');
  if(precipWM!=='none'){
    wmctx.fillStyle=precipWM==='snow'?'rgba(255,255,255,0.12)':'rgba(120,160,200,0.15)';
    wmctx.fillRect(0,0,WM_W,WM_H);
  }

  // typhoon swirl overlay
  if(typeof typhoonActive!=='undefined' && typhoonActive>0.05){
    const tx=WM_CENTER.x+Math.sin(t*0.3)*10,ty=WM_CENTER.y+Math.cos(t*0.3)*6;
    wmctx.strokeStyle=`rgba(255,255,255,${Math.min(0.85,typhoonActive)})`;wmctx.lineWidth=1;
    wmctx.beginPath();wmctx.arc(tx,ty,3+Math.sin(t*3)*0.8,0,Math.PI*1.6);wmctx.stroke();
  }
  // volcanic darkening + lightning flicker in a hyper-volcanic world
  if(typeof ashLevel!=='undefined' && ashLevel>0.05){
    wmctx.fillStyle=`rgba(20,15,12,${Math.min(0.55,ashLevel*0.6)})`;
    wmctx.fillRect(0,0,WM_W,WM_H);
  }
  if(typeof lightningFlash!=='undefined' && lightningFlash>0.5){
    wmctx.fillStyle=`rgba(255,255,255,${(lightningFlash-0.5)*0.5})`;
    wmctx.fillRect(0,0,WM_W,WM_H);
  }
}

function drawTri(ctx,x,y,w,h,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x-w/2,y);ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();}
function drawRect(ctx,x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x-w/2,y-h,w,h);}

function drawCreature(c,p,t){
  const x0=p.bx,y0=p.by;
  const col=c.color;
  mctx.fillStyle=col;
  switch(c.beh){
    case 'drift':{
      const x=x0*MW+Math.sin(t*0.6+p.seed)*3;
      const y=SEA_TOP+4+y0*(SEA_BOT-SEA_TOP-8)+Math.cos(t*0.5+p.seed)*2;
      mctx.globalAlpha=0.55;mctx.fillRect(x,y,1,1);mctx.globalAlpha=1;
      break;}
    case 'kelp':{
      const x=x0*MW;const baseY=FLOOR_TOP+1+y0*(FLOOR_BOT-FLOOR_TOP-2);const sway=Math.sin(t*1.1+p.seed)*3;
      mctx.strokeStyle=col;mctx.lineWidth=1;mctx.beginPath();
      mctx.moveTo(x,baseY);mctx.quadraticCurveTo(x+sway,baseY-5,x+sway*1.6,baseY-9);mctx.stroke();
      break;}
    case 'pulse':{
      const x=x0*MW;const y=SEA_TOP+8+y0*(SEA_BOT-SEA_TOP-16);
      const rr=1.6+Math.sin(t*2.4+p.seed)*0.6;
      mctx.globalAlpha=0.8;mctx.beginPath();mctx.ellipse(x,y,rr,rr*0.7,0,0,Math.PI*2);mctx.fill();
      mctx.strokeStyle=col;mctx.globalAlpha=0.4;mctx.lineWidth=0.6;
      mctx.beginPath();mctx.moveTo(x-1,y+rr*0.7);mctx.lineTo(x-1,y+rr*0.7+2);mctx.moveTo(x+1,y+rr*0.7);mctx.lineTo(x+1,y+rr*0.7+2.5);mctx.stroke();
      mctx.globalAlpha=1;
      break;}
    case 'crawl':{
      const x=((x0+t*0.01*p.spd*p.dir)%1+1)%1*MW;
      const y=FLOOR_TOP+2+y0*(FLOOR_BOT-FLOOR_TOP-3);
      if(c.kind==='trilo'){
        // oval body with segment lines, like a trilobite
        mctx.fillStyle=col;mctx.beginPath();mctx.ellipse(x,y,1.8,1,0,0,Math.PI*2);mctx.fill();
        mctx.strokeStyle='rgba(0,0,0,0.35)';mctx.lineWidth=0.3;
        for(let s=-1;s<=1;s++){mctx.beginPath();mctx.moveTo(x+s*0.6,y-0.9);mctx.lineTo(x+s*0.6,y+0.9);mctx.stroke();}
      } else {
        // crab: round body + pincers
        mctx.fillStyle=col;mctx.beginPath();mctx.arc(x,y,1.3,0,Math.PI*2);mctx.fill();
        mctx.strokeStyle=col;mctx.lineWidth=0.5;
        mctx.beginPath();mctx.moveTo(x-1.3,y-0.3);mctx.lineTo(x-2.2,y-1);mctx.moveTo(x+1.3,y-0.3);mctx.lineTo(x+2.2,y-1);mctx.stroke();
        mctx.beginPath();mctx.moveTo(x-1,y+1);mctx.lineTo(x-1.6,y+1.8);mctx.moveTo(x+1,y+1);mctx.lineTo(x+1.6,y+1.8);mctx.stroke();
      }
      break;}
    case 'static':{
      const x=x0*MW;const y=FLOOR_TOP+2+y0*(FLOOR_BOT-FLOOR_TOP-3);
      // fan-shaped shell / clam
      mctx.fillStyle=col;mctx.beginPath();mctx.moveTo(x-1.6,y);mctx.quadraticCurveTo(x,y-2,x+1.6,y);mctx.quadraticCurveTo(x,y+0.8,x-1.6,y);mctx.fill();
      mctx.strokeStyle='rgba(0,0,0,0.3)';mctx.lineWidth=0.25;
      for(let s=-1;s<=1;s++){mctx.beginPath();mctx.moveTo(x+s*0.9,y-0.2);mctx.lineTo(x,y-1.6);mctx.stroke();}
      break;}
    case 'swim':{
      const x=((x0+t*0.018*p.spd*p.dir)%1+1)%1*MW;
      const y=SEA_TOP+8+y0*(SEA_BOT-SEA_TOP-16)+Math.sin(t*3+p.seed)*1.6;
      const w=2.2*(c.sz||1),h=1.2*(c.sz||1);
      mctx.beginPath();
      if(p.dir>0){mctx.moveTo(x-w/2,y);mctx.lineTo(x+w/2,y-h/2);mctx.lineTo(x+w/2,y+h/2);}
      else{mctx.moveTo(x+w/2,y);mctx.lineTo(x-w/2,y-h/2);mctx.lineTo(x-w/2,y+h/2);}
      mctx.closePath();mctx.fill();
      break;}
    case 'hop':{
      const x=((x0+t*0.01*p.dir)%1+1)%1*MW;
      const ly=LAND_TOP+3+y0*(LAND_BASE-LAND_TOP-5);
      const y=ly-1-Math.abs(Math.sin(t*3+p.seed))*2.2;
      mctx.fillRect(x-1,y-1,2,1.6);
      break;}
    case 'walk':{
      const x=((x0+t*0.014*p.spd*p.dir)%1+1)%1*MW;
      const curEraId=ERAS[curEraIdx].id;
      const eraScale=c.kind==='dino'?(DINO_ERA_SCALE[curEraId]||1):(c.kind==='bug'?(BUG_ERA_SCALE[curEraId]||1):1);
      const sz=(c.sz||1)*lerp(0.6,1.15,y0)*eraScale;
      const ly=LAND_TOP+3+y0*(LAND_BASE-LAND_TOP-5);
      const bob=Math.abs(Math.sin(t*5+p.seed))*0.6;
      drawRect(mctx,x,ly-bob,2*sz,1.6*sz,col);
      mctx.fillRect(x-0.6*sz,ly-0.6,0.6,0.8);
      mctx.fillRect(x+0.2*sz,ly-0.6,0.6,0.8);
      break;}
    case 'fly':{
      const x=((x0+t*0.03*p.spd*p.dir)%1+1)%1*MW;
      const y=SKY_TOP+8+y0*(SKY_BOT-SKY_TOP-18)+Math.sin(t*4+p.seed)*2;
      const flap=Math.sin(t*9+p.seed)*1.4;
      mctx.strokeStyle=col;mctx.lineWidth=0.8;mctx.beginPath();
      mctx.moveTo(x-2,y-flap);mctx.lineTo(x,y);mctx.lineTo(x+2,y-flap);mctx.stroke();
      break;}
    case 'shroom':{
      const x=x0*MW;const ly=LAND_TOP+3+y0*(LAND_BASE-LAND_TOP-5);
      const eraId=ERAS[curEraIdx].id;
      if(eraId==='silurian'||eraId==='devonian'){
        // Prototaxites — giant ~10m fungal trunk, towering over the early land flora
        const depthScale=lerp(0.6,1.25,y0);
        const h=(11+p.variant*2)*depthScale;
        mctx.strokeStyle='#c9b18a';mctx.lineWidth=1.6*depthScale;
        mctx.beginPath();mctx.moveTo(x,ly);mctx.lineTo(x,ly-h);mctx.stroke();
        mctx.strokeStyle='rgba(120,95,60,0.5)';mctx.lineWidth=0.4;
        for(let r=1;r<h;r+=2.2){mctx.beginPath();mctx.moveTo(x-0.8*depthScale,ly-r);mctx.lineTo(x+0.8*depthScale,ly-r);mctx.stroke();}
        mctx.fillStyle='#d8c49a';mctx.beginPath();mctx.ellipse(x,ly-h,1.1*depthScale,0.7*depthScale,0,0,Math.PI*2);mctx.fill();
      } else {
        const y=ly-0.5;
        const pulse=(0.9+Math.sin(t*1.6+p.seed)*0.15)*lerp(0.7,1.1,y0);
        mctx.fillStyle=col;mctx.beginPath();mctx.ellipse(x,y-1.4*pulse,1.4*pulse,0.9*pulse,0,Math.PI,0);mctx.fill();
        mctx.fillStyle='#d5b895';mctx.fillRect(x-0.3,y-1.4*pulse,0.6,1.4*pulse);
      }
      break;}
    case 'lichenpatch':{
      // low ground-hugging moss/lichen patch — no trunk, earliest land flora
      const x=x0*MW;const ly=LAND_TOP+3+y0*(LAND_BASE-LAND_TOP-5);
      const depthScale=lerp(0.6,1.1,y0);
      mctx.fillStyle=col;mctx.globalAlpha=0.85;
      mctx.beginPath();mctx.ellipse(x,ly-0.3,2*depthScale,0.9*depthScale,0,0,Math.PI*2);mctx.fill();
      mctx.globalAlpha=1;
      break;}
    case 'lycopod':{
      // Lepidodendron / Sigillaria / giant tree-fern — Carboniferous megaflora, 3 distinct silhouettes
      const x=x0*MW;const ly=LAND_TOP+2+y0*(LAND_BASE-LAND_TOP-4);
      const depthScale=lerp(0.55,1.25,y0);
      const lean=Math.sin(t*0.8+p.seed)*0.04*clamp(windRatio(),0.3,3.5);
      const h=(9+p.variant*3)*depthScale;
      const topX=x+lean*h;
      if(p.variant===2){
        // giant fern — short trunk, arching fronds radiating from the crown
        const fh=h*0.55;
        mctx.strokeStyle=col;mctx.lineWidth=1.3*depthScale;
        mctx.beginPath();mctx.moveTo(x,ly);mctx.lineTo(topX,ly-fh);mctx.stroke();
        for(let a=-3;a<=3;a++){
          const ang=-Math.PI/2+a*0.28;
          const fx=topX+Math.cos(ang)*4.2*depthScale,fy=(ly-fh)+Math.sin(ang)*3*depthScale;
          mctx.strokeStyle=col;mctx.lineWidth=0.6*depthScale;
          mctx.beginPath();mctx.moveTo(topX,ly-fh);mctx.quadraticCurveTo(topX+Math.cos(ang)*2.2*depthScale,(ly-fh)+Math.sin(ang)*1.2*depthScale,fx,fy);mctx.stroke();
        }
        break;
      }
      mctx.strokeStyle=col;mctx.lineWidth=1.5*depthScale;
      mctx.beginPath();mctx.moveTo(x,ly);mctx.lineTo(topX,ly-h);mctx.stroke();
      // diamond scale-bark texture
      mctx.strokeStyle='rgba(0,0,0,0.25)';mctx.lineWidth=0.3;
      for(let r=2;r<h-1;r+=2.4){const rx=lerp(x,topX,r/h);mctx.beginPath();mctx.moveTo(rx-0.7,ly-r);mctx.lineTo(rx+0.7,ly-r+1.1);mctx.moveTo(rx+0.7,ly-r);mctx.lineTo(rx-0.7,ly-r+1.1);mctx.stroke();}
      // sparse crown tuft (variant 0: rounded, variant 1: spiky Sigillaria rosette)
      mctx.fillStyle=col;
      if(p.variant===0){mctx.beginPath();mctx.ellipse(topX,ly-h-0.8*depthScale,1.6*depthScale,1*depthScale,0,0,Math.PI*2);mctx.fill();}
      else{for(let a=-2;a<=2;a++){mctx.beginPath();mctx.moveTo(topX,ly-h);mctx.lineTo(topX+a*0.9*depthScale,ly-h-2.2*depthScale);mctx.lineTo(topX+a*0.9*depthScale+0.4,ly-h);mctx.fill();}}
      break;}
    case 'conifer':{
      // gymnosperm — conical stacked evergreen silhouette
      const x=x0*MW;const ly=LAND_TOP+2+y0*(LAND_BASE-LAND_TOP-4);
      const depthScale=lerp(0.55,1.2,y0);
      const lean=Math.sin(t*1.1+p.seed)*0.08*clamp(windRatio(),0.3,3.5);
      const h=(6+p.variant*2)*depthScale;
      mctx.strokeStyle='#6b4a2b';mctx.lineWidth=0.6*depthScale;
      mctx.beginPath();mctx.moveTo(x,ly);mctx.lineTo(x+lean*h,ly-h*0.3);mctx.stroke();
      mctx.fillStyle=col;
      for(let tier=0;tier<3;tier++){
        const ty=ly-h*0.25-tier*h*0.32;
        const tw=(2.6-tier*0.6)*depthScale;
        drawTri(mctx,x+lean*h*(tier/3),ty,tw,h*0.42*depthScale,col);
      }
      break;}
    case 'flowering':{
      // angiosperm — rounded leafy canopy (green) with small accent flowers, NOT a solid-color tree
      const x=x0*MW;const ly=LAND_TOP+2+y0*(LAND_BASE-LAND_TOP-4);
      const depthScale=lerp(0.55,1.2,y0);
      const lean=Math.sin(t*1.15+p.seed)*0.1*clamp(windRatio(),0.3,3.5);
      const h=(4.5+p.variant*1.6)*depthScale;
      mctx.strokeStyle='#6b4a2b';mctx.lineWidth=0.7*depthScale;
      mctx.beginPath();mctx.moveTo(x,ly);mctx.lineTo(x+lean*h,ly-h);mctx.stroke();
      const cx=x+lean*h,cy=ly-h-1.3*depthScale;
      mctx.fillStyle=col;mctx.beginPath();mctx.ellipse(cx,cy,2*depthScale,2.1*depthScale,0,0,Math.PI*2);mctx.fill();
      const flowerCols=['#f8c8d4','#f7dc6f','#ffffff'];
      const fc=flowerCols[Math.floor(p.seed)%flowerCols.length];
      mctx.fillStyle=fc;
      for(let k=0;k<3;k++){
        const ang=p.seed+k*2.1;
        mctx.beginPath();mctx.arc(cx+Math.cos(ang)*1.3*depthScale,cy+Math.sin(ang)*1.1*depthScale,0.45*depthScale,0,Math.PI*2);mctx.fill();
      }
      break;}
  }
}

function computeLandBiome(){
  const iceR=state.surface.ice/100;
  if(state.snowball || iceR>0.55) return 'snow';
  if(state.temp>34 && (state.atmo.H2O||0)<1.5) return 'desert';
  if(state.surface.magma>25) return 'barren';
  return 'green';
}

// land-cover breakdown (of the non-ice land portion) — a design estimate driven by temperature,
// humidity, and terrestrial plant biomass, so it shifts naturally with warming/cooling/extinction events
function computeLandComposition(){
  const plantSum=clamp(sumBio(['lichen','spore_plant','gymnosperm','angiosperm'])/110,0,1);
  const dryness=clamp(1-(state.humidityPct/65),0,1);
  const heat=clamp((state.temp-18)/22,0,1);
  const desertF=clamp(dryness*0.6+heat*0.5,0,1);
  if(plantSum<0.06){
    const desert=clamp(30+desertF*45,15,80);
    return {barren:100-desert,desert,forest:0,grassland:0,savanna:0};
  }
  let forest=plantSum*(1-desertF*0.8)*0.7;
  let desert=desertF*0.55;
  let remain=Math.max(0,1-forest-desert);
  let grassland=remain*clamp(1-heat*0.7,0.25,0.85);
  let savanna=Math.max(0,remain-grassland);
  const tot=forest+desert+grassland+savanna||1;
  return {forest:forest/tot*100,grassland:grassland/tot*100,savanna:savanna/tot*100,desert:desert/tot*100,barren:0};
}

// ---- 増減傾向インジケータ（数秒ごとにスナップショットを取り、その差分から矢印を決める） ----
const trendSnapshots={};
const TREND_INTERVAL=4.5;
function trendIndicator(key,value,scale){
  const snap=trendSnapshots[key];
  if(!snap||clockT-snap.time>TREND_INTERVAL){
    const delta=snap?value-snap.value:0;
    trendSnapshots[key]={value,time:clockT,delta};
  }
  const d=(trendSnapshots[key]&&trendSnapshots[key].delta)||0;
  const rel=scale?d/scale:0;
  if(Math.abs(rel)<0.04) return '<span style="color:#3a5a78">―</span>';
  if(rel>0.28) return '<span style="color:#ff8c5a">⏫</span>';
  if(rel>0) return '<span style="color:#98fb98">▲</span>';
  if(rel<-0.28) return '<span style="color:#5dade2">⏬</span>';
  return '<span style="color:#f7dc6f">▼</span>';
}

function drawMacro(t){
  const co2f=clamp((state.atmo.CO2||0)/20,0,1);
  const o2f=clamp((state.atmo.O2||0)/25,0,1);
  const h2of=clamp((state.atmo.H2O||0)/8,0,1);
  const ch4f=clamp((state.atmo.CH4||0)/5,0,1);
  const iceR=state.surface.ice/100;
  const tempC=state.temp;
  const dayPhase=(t*0.015)%1;
  const nightFactor=(Math.sin(dayPhase*Math.PI*2-Math.PI/2)+1)/2; // 0=night,1=day

  mctx.clearRect(0,0,MW,MH);
  if(quakeActive>0.02){
    const shakeMag=quakeActive*2.6;
    const sx=(Math.sin(t*41)+Math.sin(t*67))*shakeMag*0.5;
    const sy=(Math.cos(t*53)+Math.sin(t*79))*shakeMag*0.35;
    mctx.save();mctx.translate(sx,sy);
  }

  // ---- SKY ----
  let sky=hexToRgb('#6fa8dc');
  sky=mixC(sky,hexToRgb('#b5453a'),co2f*0.75);
  sky=mixC(sky,hexToRgb('#c9b25c'),ch4f*0.55);
  sky=mixC(sky,hexToRgb('#82c8ff'),o2f*0.25);
  if(state.snowball||iceR>0.7) sky=mixC(sky,hexToRgb('#dcecf5'),0.55);
  sky=mixC(sky,hexToRgb('#5a5a5a'),Math.min(0.7,ashLevel));
  const skyLit=scaleC(sky,0.4+0.6*nightFactor);
  const skyHorizon=scaleC(mixC(sky,hexToRgb('#ffe1b0'),0.15*nightFactor*(1-nightFactor)*4),0.5+0.5*nightFactor);
  const skyGrad=mctx.createLinearGradient(0,SKY_TOP,0,LAND_TOP);
  skyGrad.addColorStop(0,rgbToCss(scaleC(skyLit,0.85)));
  skyGrad.addColorStop(1,rgbToCss(skyHorizon));
  mctx.fillStyle=skyGrad;mctx.fillRect(0,SKY_TOP,MW,LAND_TOP-SKY_TOP);

  // stars at night
  if(!_macroStars) initMacroStars();
  if(nightFactor<0.4){
    const a=(0.4-nightFactor)/0.4;
    _macroStars.forEach(s=>{mctx.globalAlpha=a*(0.5+0.5*Math.sin(t*2+s.ph));mctx.fillStyle='#fff';mctx.fillRect(s.x,s.y,s.r,s.r);});
    mctx.globalAlpha=1;
  }
  // sun/moon
  const sunX=MW*dayPhase;
  const sunY=SKY_TOP+8+ (1-Math.sin(dayPhase*Math.PI))*(SKY_BOT-SKY_TOP-20);
  if(nightFactor>0.15){
    mctx.fillStyle='rgba(255,235,150,0.9)';mctx.beginPath();mctx.arc(sunX,sunY,3.2,0,Math.PI*2);mctx.fill();
  } else {
    mctx.fillStyle='rgba(220,225,235,0.85)';mctx.beginPath();mctx.arc(sunX,sunY,2.6,0,Math.PI*2);mctx.fill();
  }

  // aurora during deep cold at night
  if((state.snowball||tempC<-15) && nightFactor<0.35){
    for(let i=0;i<2;i++){
      mctx.strokeStyle=i===0?'rgba(110,230,170,0.35)':'rgba(180,120,230,0.28)';
      mctx.lineWidth=2;mctx.beginPath();
      for(let x=0;x<=MW;x+=4){const y=SKY_TOP+6+i*5+Math.sin(x*0.08+t*1.3+i)*4;if(x===0)mctx.moveTo(x,y);else mctx.lineTo(x,y);}
      mctx.stroke();
    }
  }

  if(!skyClouds.length) initMacroParticles();
  // clouds — density now driven by live humidity as well as era cloud baseline; speed driven by wind
  const windFactor=clamp(windRatio(),0.3,6);
  const cloudDensity=clamp(state.clouds*0.4+(state.humidityPct/100)*0.85,0,1.3);
  const visibleCloudCount=Math.max(2,Math.round(skyClouds.length*clamp(cloudDensity,0.15,1)));
  skyClouds.forEach((c,ci)=>{
    c.x=(c.x+c.speed*(0.3+h2of)*0.02*windFactor)%1;
    if(ci>=visibleCloudCount) return;
    const cx=c.x*MW,cy=SKY_TOP+c.y*(SKY_BOT-SKY_TOP-10)+4;
    mctx.globalAlpha=c.alpha*(0.3+cloudDensity*0.9)*(0.5+0.5*nightFactor);
    const cloudCol=mixC(hexToRgb('#f4f7fb'),hexToRgb('#2b2622'),Math.min(1,ashLevel*1.4));
    mctx.fillStyle=rgbToCss(cloudCol);
    mctx.beginPath();mctx.ellipse(cx,cy,c.w*0.5,c.w*0.22,0,0,Math.PI*2);mctx.fill();
    mctx.globalAlpha=1;
  });

  // typhoon — distinctive rotating spiral cloud band, clearly recognizable as a cyclone
  if(typhoonActive>0.03){
    const tcx=MW*0.5,tcy=SKY_TOP+18;
    mctx.globalAlpha=Math.min(0.7,typhoonActive);
    for(let arm=0;arm<3;arm++){
      mctx.strokeStyle='#eef3f8';mctx.lineWidth=2.4;
      mctx.beginPath();
      for(let a=0;a<2.6;a+=0.2){
        const ang=a+arm*2.1+t*1.8;
        const r=3+a*7;
        const px=tcx+Math.cos(ang)*r,py=tcy+Math.sin(ang)*r*0.55;
        if(a===0)mctx.moveTo(px,py);else mctx.lineTo(px,py);
      }
      mctx.stroke();
    }
    mctx.fillStyle='rgba(80,100,120,0.6)';mctx.beginPath();mctx.arc(tcx,tcy,2,0,Math.PI*2);mctx.fill();
    mctx.globalAlpha=1;
  }

  // ash particles
  if(ashLevel>0.05){
    mctx.fillStyle=`rgba(90,90,90,${Math.min(0.8,ashLevel)})`;
    for(let i=0;i<18;i++){
      const ax=(i*37+t*20)%MW;
      const ay=SKY_TOP+((i*53+t*30)%(LAND_BASE-SKY_TOP));
      mctx.fillRect(ax,ay,1,1);
    }
  }

  // lightning flash
  if(lightningFlash>0.5){
    mctx.fillStyle=`rgba(255,255,255,${(lightningFlash-0.5)*0.6})`;
    mctx.fillRect(0,SKY_TOP,MW,LAND_TOP-SKY_TOP);
    mctx.strokeStyle='rgba(255,255,240,0.9)';mctx.lineWidth=1;
    mctx.beginPath();const lx=20+Math.random()*(MW-40);mctx.moveTo(lx,SKY_TOP+2);
    mctx.lineTo(lx+4,SKY_TOP+18);mctx.lineTo(lx-3,SKY_TOP+30);mctx.lineTo(lx+2,LAND_TOP-4);mctx.stroke();
  }

  // meteor — bigger, clearer fireball with glowing trail
  if(meteorActive){
    for(let i=0;i<6;i++){
      const tx=meteorX-i*2.2,ty=meteorY-i*3.2;
      mctx.fillStyle=`rgba(255,${170-i*15},${60-i*8<0?0:60-i*8},${0.7-i*0.11})`;
      mctx.beginPath();mctx.arc(tx,ty,2.6-i*0.35,0,Math.PI*2);mctx.fill();
    }
    const glow=mctx.createRadialGradient(meteorX,meteorY,0,meteorX,meteorY,5);
    glow.addColorStop(0,'rgba(255,240,200,0.95)');glow.addColorStop(0.5,'rgba(255,160,50,0.6)');glow.addColorStop(1,'rgba(255,120,30,0)');
    mctx.fillStyle=glow;mctx.beginPath();mctx.arc(meteorX,meteorY,5,0,Math.PI*2);mctx.fill();
    mctx.fillStyle='#fff6dd';mctx.beginPath();mctx.arc(meteorX,meteorY,1.6,0,Math.PI*2);mctx.fill();
  }

  // crater + smoke aftermath from a recent meteor impact
  if(craterMark>0.02){
    const cy=LAND_BASE-1;
    mctx.fillStyle=`rgba(40,30,25,${craterMark*0.8})`;
    mctx.beginPath();mctx.ellipse(craterX,cy,5*craterMark+2,1.6,0,0,Math.PI*2);mctx.fill();
    for(let i=0;i<4;i++){
      const sx=craterX+Math.sin(t*1.5+i)*3,sy=cy-3-i*4*craterMark-((1-craterMark)*6);
      mctx.fillStyle=`rgba(120,120,120,${craterMark*0.5})`;
      mctx.beginPath();mctx.arc(sx,sy,1.6+i*0.4,0,Math.PI*2);mctx.fill();
    }
  }

  // ---- LAND ----
  const biome=computeLandBiome();
  const landPlantSum=clamp(sumBio(['lichen','spore_plant','gymnosperm','angiosperm'])/110,0,1);
  let landCol;
  if(biome==='snow') landCol=mixC(hexToRgb('#eef6fb'),hexToRgb('#c7dde8'),0.3);
  else if(biome==='desert') landCol=mixC(hexToRgb('#d9b877'),hexToRgb('#c99a52'),0.4);
  else if(biome==='barren') landCol=mixC(hexToRgb('#5b4636'),hexToRgb('#3a2c22'),0.4);
  else {
    landCol=mixC(hexToRgb('#8a7a4a'),hexToRgb('#2e7d3e'),landPlantSum);
  }
  landCol=scaleC(landCol,0.5+0.5*nightFactor);
  mctx.fillStyle=rgbToCss(landCol);
  mctx.fillRect(0,LAND_TOP,MW,LAND_BASE-LAND_TOP);

  // mountains (poke into sky band) — height shifts over hundreds of millions of years: tectonic uplift & erosion
  const tec=deriveTectonics(ERAS[curEraIdx].id);
  const mountainFactor=0.75+tec.mountain*0.1; // plate-tectonics mountain-building rating (1-5) scales peak height
  let tallestM=null,tallestH=-1;
  mountains.forEach(m=>{
    const tectonic=0.5+0.5*Math.sin(simMya*m.freq+m.phase);
    let h=lerp(m.hMin,m.hMax,tectonic)*mountainFactor;
    h*=clamp(1-(windRatio()-1)*0.16,0.55,1.3); // wind/rain erosion wears peaks down over time
    h+=Math.min(6,state.surface.magma/12); // active volcanism builds mountains up
    h=Math.min(h,(LAND_TOP-SKY_TOP)*0.4); // never taller than ~40% of the sky's height
    const peakY=m.base-h;
    let mc=biome==='snow'?'#dfeaf2':(biome==='desert'?'#b98f57':'#6e7a72');
    mc=rgbToCss(scaleC(hexToRgb(mc),0.5+0.5*nightFactor));
    drawTri(mctx,m.cx,m.base,m.w,h,mc);
    if(iceR>0.15||biome==='snow'){
      mctx.fillStyle='rgba(255,255,255,0.85)';
      drawTri(mctx,m.cx,peakY+7,m.w*0.35,7,'rgba(255,255,255,0.85)');
    }
    if(h>tallestH){tallestH=h;tallestM={cx:m.cx,peakY};}
  });

  // volcano eruption — clear, recognizable plume + lava fountain at the tallest peak
  if(volcanoActive>0.02 && tallestM){
    const ex=tallestM.cx,ey=tallestM.peakY;
    for(let i=0;i<5;i++){
      const sx=ex+Math.sin(t*1.3+i*1.7)*(2+i*1.4);
      const sy=ey-i*5-((1-volcanoActive)*10);
      mctx.fillStyle=`rgba(90,90,90,${volcanoActive*0.55})`;
      mctx.beginPath();mctx.arc(sx,sy,2+i*0.9,0,Math.PI*2);mctx.fill();
    }
    mctx.fillStyle=`rgba(255,${100+Math.round(80*Math.sin(t*4))},30,${0.6+0.35*volcanoActive})`;
    mctx.beginPath();mctx.moveTo(ex-2,ey);mctx.lineTo(ex,ey-6-4*volcanoActive);mctx.lineTo(ex+2,ey);mctx.closePath();mctx.fill();
    for(let i=0;i<3;i++){
      const ang=-Math.PI/2+(Math.sin(t*6+i)*0.9);
      const dist=3+Math.abs(Math.sin(t*5+i))*4*volcanoActive;
      mctx.fillStyle='rgba(255,140,40,0.85)';
      mctx.beginPath();mctx.arc(ex+Math.cos(ang)*dist,ey+Math.sin(ang)*dist,0.8,0,Math.PI*2);mctx.fill();
    }
  }

  // birds — drawn after mountains so they're never hidden behind a peak
  CREATURES.filter(c=>c.layer==='sky').forEach(c=>{
    if(c.colorMap) c.color=dominantColor(c.colorMap,c.color);
    const bm=sumBio(c.keys);const count=clamp(Math.round(bm/c.div),0,c.max);
    for(let i=0;i<count;i++) drawCreature(c,c.pool[i],t);
  });

  // a small UFO — landed on the ground, resting on two legs
  {
    const ux=MW*0.5,uy=LAND_BASE-2.6;
    mctx.strokeStyle='rgba(150,190,180,0.85)';mctx.lineWidth=0.6;
    mctx.beginPath();mctx.moveTo(ux-2.4,uy+1.3);mctx.lineTo(ux-1.6,uy+3.4);mctx.moveTo(ux+2.4,uy+1.3);mctx.lineTo(ux+1.6,uy+3.4);mctx.stroke();
    mctx.fillStyle='rgba(120,220,180,0.9)';
    mctx.beginPath();mctx.ellipse(ux,uy,4,1.3,0,0,Math.PI*2);mctx.fill();
    mctx.fillStyle='rgba(200,230,220,0.7)';
    mctx.beginPath();mctx.ellipse(ux,uy-1,2,1.2,0,Math.PI,0);mctx.fill();
    mctx.fillStyle=`rgba(255,255,150,${0.5+0.5*Math.sin(t*4)})`;
    mctx.beginPath();mctx.arc(ux-2,uy+0.3,0.5,0,Math.PI*2);mctx.arc(ux,uy+0.5,0.5,0,Math.PI*2);mctx.arc(ux+2,uy+0.3,0.5,0,Math.PI*2);mctx.fill();
  }

  // wind streaks — visible gust lines when wind is strong (drawn after mountains so they don't hide behind peaks)
  if(windRatio()>1.25){
    const gustA=clamp((windRatio()-1.25)*0.35,0.15,0.6);
    mctx.strokeStyle=`rgba(255,255,255,${gustA})`;mctx.lineWidth=0.5;
    for(let i=0;i<5;i++){
      const gy=SKY_TOP+8+((i*13+t*windFactor*30)%(LAND_BASE-SKY_TOP-10));
      const gx=(i*37+t*windFactor*50)%MW;
      mctx.beginPath();mctx.moveTo(gx,gy);mctx.lineTo(gx-6,gy+1.4);mctx.stroke();
    }
  }

  // earthquake — jagged ground cracks + dust, fading as the tremor settles
  if(quakeActive>0.03){
    mctx.strokeStyle=`rgba(20,15,10,${quakeActive*0.8})`;mctx.lineWidth=0.7;
    for(let c=0;c<3;c++){
      const cx0=20+c*55+Math.sin(c*7)*10;
      mctx.beginPath();mctx.moveTo(cx0,LAND_TOP+4);
      let cx=cx0;
      for(let seg=0;seg<4;seg++){cx+=Math.sin(t*3+c*2+seg)*3;mctx.lineTo(cx,LAND_TOP+4+seg*5);}
      mctx.stroke();
    }
    for(let i=0;i<5;i++){
      const dx=30+i*26+Math.sin(t*2+i)*4,dy=LAND_BASE-1-Math.abs(Math.sin(t*6+i))*2;
      mctx.fillStyle=`rgba(150,140,120,${quakeActive*0.4})`;
      mctx.beginPath();mctx.arc(dx,dy,1.4+quakeActive,0,Math.PI*2);mctx.fill();
    }
  }

  // land texture flecks
  terrainFlecks.forEach((f,i)=>{
    let fc;
    if(biome==='snow') fc='rgba(255,255,255,0.5)';
    else if(biome==='desert') fc=(i%2===0)?'rgba(150,110,50,0.35)':'rgba(230,210,150,0.3)';
    else if(biome==='barren') fc='rgba(20,15,10,0.4)';
    else fc=landPlantSum<0.08?((i%2===0)?'rgba(90,80,65,0.35)':'rgba(150,135,110,0.3)'):((i%3===0)?'rgba(20,60,20,0.4)':'rgba(140,200,110,0.3)');
    mctx.fillStyle=fc;mctx.fillRect(f.x,f.y,1,1);
  });

  // land creatures (trees, fungi, animals)
  CREATURES.filter(c=>c.layer==='land').forEach(c=>{
    if(c.colorMap) c.color=dominantColor(c.colorMap,c.color);
    const bm=sumBio(c.keys);const count=clamp(Math.round(bm/c.div),0,c.max);
    for(let i=0;i<count;i++) drawCreature(c,c.pool[i],t);
  });
  const settleCount=clamp(Math.round((state.bio.human||0)/0.15),0,settlements.length);
  for(let i=0;i<settleCount;i++) drawSettlement(settlements[i],t);

  // precipitation — positions come from the persistent simulation in updateRain (real falling motion,
  // landing at varied depths across the whole land rather than always at one line)
  const precip = tempC<2 ? 'snow' : (h2of>0.45 ? 'rain':'none');
  if(precip!=='none'){
    const intensity=clamp(h2of,0.3,1);
    const activeCount=Math.round(rainDrops.length*intensity);
    for(let i=0;i<activeCount;i++){
      const d=rainDrops[i];
      if(precip==='snow'){
        const px=(d.x+Math.sin(t*0.8+d.seed)*3+MW)%MW;
        mctx.fillStyle='rgba(255,255,255,0.8)';mctx.fillRect(px,d.y,1,1);
      } else {
        mctx.strokeStyle='rgba(180,210,240,0.55)';mctx.lineWidth=0.6;
        mctx.beginPath();mctx.moveTo(d.x,d.y);mctx.lineTo(d.x-1,d.y+3);mctx.stroke();
      }
    }
  }

  // ---- SEA ----
  const magmaF=clamp((state.surface.magma||0)/55,0,1);
  let seaCol=mixC(hexToRgb('#1c5c8a'),hexToRgb('#0d3b5c'),0.3);
  const algaeF=clamp((state.bio.algae||0)/80,0,1);
  seaCol=mixC(seaCol,hexToRgb('#1f7a52'),algaeF*0.35);
  seaCol=mixC(seaCol,hexToRgb('#2e86c1'),h2of*0.3);
  if(iceR>0.4||state.snowball) seaCol=mixC(seaCol,hexToRgb('#cfe8f5'),clamp(iceR,0,0.85));
  seaCol=mixC(seaCol,hexToRgb('#e0470f'),magmaF); // hadean/molten world: sea rendered as a magma ocean
  seaCol=scaleC(seaCol,magmaF>0.4?(0.7+0.3*Math.sin(t*1.6)):(0.55+0.45*nightFactor));
  const seaGrad=mctx.createLinearGradient(0,SEA_TOP,0,SEA_BOT);
  if(magmaF>0.4){
    seaGrad.addColorStop(0,rgbToCss(scaleC(seaCol,1.35)));
    seaGrad.addColorStop(0.5,rgbToCss(seaCol));
    seaGrad.addColorStop(1,rgbToCss(scaleC(seaCol,0.6)));
  } else {
    seaGrad.addColorStop(0,rgbToCss(scaleC(seaCol,1.15)));
    seaGrad.addColorStop(1,rgbToCss(scaleC(seaCol,0.75)));
  }
  mctx.fillStyle=seaGrad;mctx.fillRect(0,SEA_TOP,MW,SEA_BOT-SEA_TOP);

  // ice sheet over sea if frozen
  if((iceR>0.5||state.snowball)){
    mctx.fillStyle=`rgba(230,245,255,${clamp(iceR,0.3,0.9)})`;
    mctx.fillRect(0,SEA_TOP,MW,4);
  } else if(magmaF>0.4){
    // lava glow ripples instead of water waves
    mctx.strokeStyle=`rgba(255,${Math.round(140+60*Math.sin(t*2))},60,0.6)`;mctx.lineWidth=0.9;
    mctx.beginPath();
    for(let x=0;x<=MW;x+=3){const y=SEA_TOP+2+Math.sin(x*0.25+t*1.8)*1.4;if(x===0)mctx.moveTo(x,y);else mctx.lineTo(x,y);}
    mctx.stroke();
    for(let i=0;i<6;i++){
      const gx=(i*29+t*10)%MW,gy=SEA_TOP+4+((i*17)%(SEA_BOT-SEA_TOP-8));
      mctx.fillStyle=`rgba(255,200,80,${0.3+0.3*Math.sin(t*3+i)})`;mctx.fillRect(gx,gy,1.6,1.6);
    }
  } else {
    // waves — a single clean line; height/speed/direction convey wind, and it never rises into the land layer above
    const seaState=clamp(windRatio()*0.6+(typeof typhoonActive!=='undefined'?typhoonActive*2:0),0.4,3.5);
    const waveAmp=clamp(0.6+seaState*0.7,0.6,3);
    const windDir=Math.sin(simMya*0.0006)>=0?1:-1;
    const waveSpeed=(1.1+seaState*0.85)*windDir;
    mctx.strokeStyle='rgba(255,255,255,0.4)';mctx.lineWidth=0.8;
    mctx.beginPath();
    for(let x=0;x<=MW;x+=2){
      const y=SEA_TOP+2+waveAmp+Math.sin(x*0.25*windDir+t*waveSpeed)*waveAmp;
      if(x===0)mctx.moveTo(x,y);else mctx.lineTo(x,y);
    }
    mctx.stroke();
    if(seaState>1.6){
      mctx.fillStyle=`rgba(255,255,255,${clamp((seaState-1.6)*0.35,0,0.55)})`;
      for(let x=0;x<MW;x+=7){const y=SEA_TOP+2+waveAmp+Math.sin(x*0.25*windDir+t*waveSpeed)*waveAmp;mctx.fillRect(x,y-1,1.3,1.3);}
    }
  }

  // sea flecks (sparkle/foam)
  seaFlecks.forEach((f,i)=>{
    mctx.fillStyle=i%4===0?'rgba(255,255,255,0.25)':'rgba(255,255,255,0.08)';
    mctx.fillRect(f.x,f.y,1,1);
  });

  CREATURES.filter(c=>c.layer==='sea').forEach(c=>{
    if(c.colorMap) c.color=dominantColor(c.colorMap,c.color);
    const bm=sumBio(c.keys);const count=clamp(Math.round(bm/c.div),0,c.max);
    for(let i=0;i<count;i++) drawCreature(c,c.pool[i],t);
  });
  const mrStyle=MARINE_REPTILE_ERA[ERAS[curEraIdx].id];
  if(mrStyle){marineReptiles.forEach(p=>drawMarineReptile(p,t,mrStyle));}

  // ---- SEAFLOOR ----
  const floorCol=state.surface.magma>10?'#3a1a12':'#0a1f2e';
  mctx.fillStyle=floorCol;mctx.fillRect(0,FLOOR_TOP,MW,FLOOR_BOT-FLOOR_TOP);
  if(state.surface.magma>3){
    bubbles.forEach(b=>{
      b.y=(b.y-b.speed*0.01+1)%1;
      const bx=b.x*MW,by=FLOOR_TOP+ b.y*(SEA_BOT-FLOOR_TOP);
      mctx.fillStyle='rgba(255,140,60,0.5)';mctx.fillRect(bx,by,1,1);
    });
    mctx.fillStyle='rgba(255,90,40,0.6)';
    mctx.fillRect(MW*0.5-1,FLOOR_TOP,2,2);
  }

  CREATURES.filter(c=>c.layer==='floor').forEach(c=>{
    if(c.colorMap) c.color=dominantColor(c.colorMap,c.color);
    const bm=sumBio(c.keys);const count=clamp(Math.round(bm/c.div),0,c.max);
    for(let i=0;i<count;i++) drawCreature(c,c.pool[i],t);
  });

  // ---- SUBSURFACE (deep biosphere: chemosynthetic microbes in the rock) ----
  mctx.fillStyle='#150e0c';mctx.fillRect(0,SUB_TOP,MW,SUB_BOT-SUB_TOP);
  mctx.strokeStyle='rgba(60,45,35,0.5)';mctx.lineWidth=0.4;
  for(let x=6;x<MW;x+=14){mctx.beginPath();mctx.moveTo(x,SUB_TOP);mctx.lineTo(x+3,SUB_BOT);mctx.stroke();}
  const microbeF=clamp(sumBio(['archaea','bacteria'])/90,0,1);
  const subCount=Math.round(4+microbeF*22);
  for(let i=0;i<subCount;i++){
    const d=subDots[i%subDots.length];
    const glow=0.3+0.5*Math.abs(Math.sin(t*0.8+d.ph));
    mctx.fillStyle=`rgba(120,220,160,${glow*0.8})`;
    mctx.fillRect(d.x,d.y,1,1);
  }

  // ---- MANTLE (molten interior — activity reflects the planet's internal heat, highest early, cooling over deep time) ----
  const mantleHeat=clamp((state.surface.magma||0)/60,0.08,1);
  const mgrad=mctx.createLinearGradient(0,MANTLE_TOP,0,MANTLE_BOT);
  mgrad.addColorStop(0,rgbToCss(scaleC(hexToRgb('#2a0e05'),1)));
  mgrad.addColorStop(1,rgbToCss(mixC(hexToRgb('#1a0805'),hexToRgb('#ff8c2e'),mantleHeat*0.9)));
  mctx.fillStyle=mgrad;mctx.fillRect(0,MANTLE_TOP,MW,MANTLE_BOT-MANTLE_TOP);
  mantlePlumes.forEach((pl,i)=>{
    pl.y=(pl.y-pl.speed*0.012+1)%1;
    const px=pl.x, py=MANTLE_TOP+pl.y*(MANTLE_BOT-MANTLE_TOP);
    const glow=(0.3+0.6*mantleHeat)*(0.5+0.5*Math.sin(t*2+pl.seed));
    mctx.fillStyle=`rgba(255,${Math.round(120+90*mantleHeat)},40,${glow})`;
    mctx.fillRect(px,py,1.6,1.6);
  });
  // bright veins pulsing with heat
  mctx.strokeStyle=`rgba(255,150,50,${0.25+0.35*mantleHeat*(0.5+0.5*Math.sin(t*1.5))})`;
  mctx.lineWidth=0.8;
  mctx.beginPath();
  for(let x=0;x<=MW;x+=4){const y=MANTLE_TOP+3+Math.sin(x*0.15+t*1.2)*2+ (MANTLE_BOT-MANTLE_TOP-6)*0.5;if(x===0)mctx.moveTo(x,y);else mctx.lineTo(x,y);}
  mctx.stroke();

  // impact flash overlay (meteor / mass extinction)
  if(quakeActive>0.02){ mctx.restore(); }
  if(impactFlash>0.02){
    mctx.fillStyle=`rgba(255,255,255,${Math.min(0.85,impactFlash)})`;
    mctx.fillRect(0,0,MW,MH);
  }
}

let uiTick=0;
function updateUI(){
  uiTick++;
  const pct=Math.max(0,Math.min(100,(TOTAL_MYA-simMya)/TOTAL_MYA*100));
  const pb=document.getElementById('progress-bar');if(pb)pb.style.width=pct.toFixed(2)+'%';
  const pl=document.getElementById('progress-label');if(pl)pl.textContent=pct.toFixed(1)+'%';
  const m=Math.max(0,simMya);
  const ydEl=document.getElementById('year-display');
  if(ydEl){if(lang==='ja')ydEl.textContent=(m>=1000?(m/1000).toFixed(2)+'十億年前':m.toFixed(1)+'百万年前');else ydEl.textContent=(m>=1000?(m/1000).toFixed(2)+' BYA':m.toFixed(1)+' MYA')+' ago';}
  if(uiTick%3!==0)return;
  const atmo=state.atmo,total=Object.values(atmo).reduce((a,b)=>a+(b||0),0)||1;
  let h='';GASES.forEach(g=>{const v=atmo[g.key]||0,p=v/total*100;const nm=g.name[lang]||g.name.en;h+=`<div class="gas-row"><span class="gas-label">${nm} (${g.label})</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,p*3)}%;background:${g.color}"></div></div><span class="gas-val" style="color:${g.color}">${p.toFixed(1)}% ${trendIndicator('gas_'+g.key,p,4)}</span></div>`;});
  document.getElementById('atmo-bars').innerHTML=h;

  const tc=state.temp>40?'#ff6b6b':state.temp<-10?'#87ceeb':'#98fb98';
  const sf2=state.surface;
  const curClimate=ERA_CLIMATE[ERAS[curEraIdx].id]||ERA_CLIMATE.hadean;
  const pMid=(curClimate.pressureAtm[0]+curClimate.pressureAtm[1])/2;
  const isHigh=state.pressureAtm>=pMid;
  const pc=isHigh?'#98fb98':'#ffa07a';
  const humidity=Math.round(state.humidityPct);
  const atmDisplay=state.pressureAtm>=10?Math.round(state.pressureAtm)+' atm':state.pressureAtm.toFixed(2)+' atm';

  const airItems=[
    {color:tc,icon:'🌡',lbl:T('temp'),val:Math.round(state.temp)+'°C '+trendIndicator('air_temp',state.temp,3)},
    {color:'#7ec8e3',icon:'💨',lbl:T('wind'),val:(lang==='ja'?'平均':'avg.')+Math.round(sf2.windAvg)+'/'+(lang==='ja'?'最大':'max.')+Math.round(sf2.windMax)+'m/s '+trendIndicator('air_wind',sf2.windAvg,4)},
    {color:pc,icon:isHigh?'⬆':'⬇',lbl:T('pressure'),val:atmDisplay+' ('+T(isHigh?'high':'low')+') '+trendIndicator('air_pressure',state.pressureAtm,0.04)},
    {color:'#87ceeb',icon:'💧',lbl:T('humidity'),val:humidity+'% '+trendIndicator('air_humidity',humidity,8)}
  ];
  document.getElementById('air-row').innerHTML=airItems.map(x=>
    `<div class="climate-item"><span class="ci-label" style="color:${x.color}"><span class="ci-icon">${x.icon}</span>${x.lbl}</span><span style="color:${x.color}">${x.val}</span></div>`).join('');

  const surfItemsAll=[
    {v:sf2.magma,color:'#ff6b6b',icon:'🌋',lbl:T('magma'),tk:'surf_magma'},
    {v:sf2.ocean,color:'#5dade2',icon:'🌊',lbl:T('ocean'),tk:'surf_ocean'},
    {v:sf2.land, color:'#82e0aa',icon:'🏔',lbl:T('land'),tk:'surf_land'},
    {v:sf2.ice,  color:'#aed6f1',icon:'🧊',lbl:T('ice_s'),tk:'surf_ice'}
  ];
  const lc=computeLandComposition();
  const landSubItems=[
    {v:lc.forest,color:'#2e8b3d',icon:'🌲',lbl:T('lc_forest'),tk:'lc_forest'},
    {v:lc.grassland,color:'#8fbc4f',icon:'🌾',lbl:T('lc_grassland'),tk:'lc_grassland'},
    {v:lc.savanna,color:'#d2a24c',icon:'🌿',lbl:T('lc_savanna'),tk:'lc_savanna'},
    {v:lc.desert,color:'#e0b25c',icon:'🏜',lbl:T('lc_desert'),tk:'lc_desert'},
    {v:lc.barren,color:'#8a7a63',icon:'🪨',lbl:T('lc_barren'),tk:'lc_barren'},
  ].filter(x=>x.v>1);
  document.getElementById('surface-row').innerHTML=surfItemsAll.filter(x=>x.v>0.5).map(x=>{
    const row=`<div class="climate-item"><span class="ci-label" style="color:${x.color}"><span class="ci-icon">${x.icon}</span>${x.lbl}</span><span style="color:${x.color}">${Math.round(x.v)}% ${trendIndicator(x.tk,x.v,20)}</span></div>`;
    if(x.tk==='surf_land' && landSubItems.length){
      const sub=landSubItems.map(s=>`<div class="climate-item" style="padding-left:12px;font-size:7px"><span class="ci-label" style="color:${s.color}"><span class="ci-icon">${s.icon}</span>${s.lbl}</span><span style="color:${s.color}">${Math.round(s.v)}% ${trendIndicator(s.tk,s.v,25)}</span></div>`).join('');
      return row+sub;
    }
    return row;
  }).join('');
  drawSurfacePie(surfItemsAll);

  const tierWord=v=>T('tier'+clamp(Math.round(v),1,5));
  const tierColor=v=>['#7ec8e3','#f7dc6f','#ffa07a','#ff8c5a','#ff6b6b'][clamp(Math.round(v),1,5)-1];
  const magmaLevel=sf2.magma;
  const magmaTierNum=magmaLevel>50?5:magmaLevel>25?4:magmaLevel>10?3:magmaLevel>2?2:1; // mantle heat never fully "dormant"
  const tec=deriveTectonics(ERAS[curEraIdx].id);
  const microbeF=clamp(sumBio(['archaea','bacteria'])/90,0,1)*5;
  const subsurfTier=clamp(Math.round(1+microbeF),1,5);
  const deepBioWord=T('deepbio'+subsurfTier);
  const crustItems=[
    {icon:'🌋',key:'crust_heat',word:tierWord(magmaTierNum),color:tierColor(magmaTierNum),desc:T('crust_heat_desc'),tk:'crust_heat',tv:magmaLevel,sc:20},
    {icon:'🌍',key:'crust_tectonics',word:tierWord(tec.activity),color:tierColor(tec.activity),desc:T('crust_tectonics_desc'),tk:'crust_tectonics',tv:tec.activity,sc:1.5},
    {icon:'🦠',key:'crust_biosphere',word:deepBioWord,color:tierColor(subsurfTier),desc:T('crust_biosphere_desc'),tk:'crust_biosphere',tv:microbeF,sc:1},
  ];
  document.getElementById('crustact-row').innerHTML=crustItems.map(x=>
    `<div style="margin-bottom:7px">
       <div class="climate-item" style="margin-bottom:1px"><span class="ci-label" style="color:#7ec8e3"><span class="ci-icon">${x.icon}</span>${T(x.key)}</span><span style="color:${x.color}">${x.word} ${trendIndicator(x.tk,x.tv,x.sc)}</span></div>
       <div style="font-size:6px;color:#3a5a78;line-height:1.3;padding-left:15px">${x.desc}</div>
     </div>`).join('');

  // ---- OCEAN tab ----
  const oceanCovPct=sf2.ocean;
  const seaLevel=Math.round((oceanCovPct-58)*2);
  const oceanVolume=(1.3*(oceanCovPct/58)).toFixed(2);
  const avgDepth=clamp(3.7*(58/Math.max(10,oceanCovPct))*0.9,0.3,7).toFixed(1);
  const seaTemp=Math.round(clamp(state.temp*0.55+3,-2,42));
  const propItems=[
    {key:'oc_coverage',val:Math.round(oceanCovPct)+'% '+trendIndicator('oc_coverage',oceanCovPct,6),color:'#5dade2'},
    {key:'oc_sealevel',val:(seaLevel>=0?'+':'')+seaLevel+' m '+trendIndicator('oc_sealevel',seaLevel,8),color:'#7ec8e3'},
    {key:'oc_volume',val:oceanVolume+' ×10⁹ km³ '+trendIndicator('oc_volume',parseFloat(oceanVolume),0.05),color:'#5dade2'},
    {key:'oc_depth',val:avgDepth+' km '+trendIndicator('oc_depth',parseFloat(avgDepth),0.2),color:'#2471a3'},
    {key:'oc_seatemp',val:seaTemp+'°C '+trendIndicator('oc_seatemp',seaTemp,3),color:seaTemp>25?'#ff6b6b':seaTemp<5?'#87ceeb':'#98fb98'},
  ];
  document.getElementById('ocean-prop-row').innerHTML=propItems.map(x=>
    `<div class="climate-item"><span class="ci-label" style="color:${x.color}">${T(x.key)}</span><span style="color:${x.color}">${x.val}</span></div>`).join('');

  const o2Diss=(clamp((state.atmo.O2||0)/25,0,1)*0.9).toFixed(2);
  const carbonDiss=(clamp((state.atmo.CO2||0)/20,0,1)*1.2).toFixed(2);
  const compItems=[
    {key:'oc_water',val:'96.5%',color:'#5dade2'},
    {key:'oc_salt',val:(3.5-clamp(state.surface.ice/100,0,1)*0.4).toFixed(1)+'%',color:'#f4f6f7'},
    {key:'oc_o2',val:o2Diss+'%',color:'#98fb98'},
    {key:'oc_carbon',val:carbonDiss+'%',color:'#95a5a6'},
    {key:'oc_nitrogen',val:'0.01%',color:'#aed6f1'},
    {key:'oc_sulfur',val:'0.05%',color:'#f7dc6f'},
    {key:'oc_minerals',val:'0.02%',color:'#e59866'},
  ];
  document.getElementById('ocean-comp-row').innerHTML=compItems.map(x=>
    `<div class="climate-item"><span class="ci-label" style="color:${x.color}">${T(x.key)}</span><span style="color:${x.color}">${x.val}</span></div>`).join('');

  const wr=windRatio();
  const seaStateNow=clamp(wr*0.6+(typeof typhoonActive!=='undefined'?typhoonActive*2:0),0.4,3.5);
  const dynWord=v=>v>2.4?tierWord(5):v>1.7?tierWord(4):v>1.1?tierWord(3):v>0.6?tierWord(2):tierWord(1);
  const dynColor=v=>tierColor(v>2.4?5:v>1.7?4:v>1.1?3:v>0.6?2:1);
  const mixWord=state.temp>25?tierWord(1):state.temp>10?tierWord(3):tierWord(5);
  const dynItems=[
    {key:'oc_current',word:dynWord(wr)+' '+trendIndicator('oc_current',wr,0.3),color:dynColor(wr)},
    {key:'oc_upwelling',word:dynWord(wr*0.9)+' '+trendIndicator('oc_upwelling',wr*0.9,0.3),color:dynColor(wr*0.9)},
    {key:'oc_mixing',word:mixWord+' '+trendIndicator('oc_mixing',state.temp,3),color:state.temp>25?'#ffa07a':state.temp>10?'#f7dc6f':'#7ec8e3'},
    {key:'oc_tide',word:tierWord(3)+' '+trendIndicator('oc_tide',3,1),color:tierColor(3)},
    {key:'oc_wave',word:dynWord(seaStateNow)+' '+trendIndicator('oc_wave',seaStateNow,0.3),color:dynColor(seaStateNow)},
  ];
  document.getElementById('ocean-dyn-row').innerHTML=dynItems.map(x=>
    `<div class="climate-item"><span class="ci-label" style="color:#7ec8e3">${T(x.key)}</span><span style="color:${x.color}">${x.word}</span></div>`).join('');

  let bh='';
  BIO_GROUPS_DEF.forEach(group=>{
    const gtitle=T('grp_'+group.gkey);
    bh+=`<div class="bio-group"><div class="bio-group-title">${gtitle}</div><div class="bio-cols">`;
    const sorted=[...group.members].sort((a,b2)=>(state.bio[b2.key]||0)-(state.bio[a.key]||0));
    sorted.forEach(m=>{
      const v=clamp(state.bio[m.key]||0,0,100);
      const barH=v<0.05?0:Math.max(2,v/100*22);
      const lbl=m[lang]||m.en;
      bh+=`<div class="bio-col"><div class="bio-col-barbg"><div class="bio-col-barfill" style="height:${barH}px;background:${m.color}"></div></div><div class="bio-col-icon">${m.icon}</div><div class="bio-col-name">${lbl}</div></div>`;
    });
    bh+='</div></div>';
  });
  document.getElementById('bio-groups').innerHTML=bh;
}

function buildTimeline(){
  const tl=document.getElementById('tl-inner');tl.innerHTML='';
  ERAS.forEach((e,i)=>{const name=e.name[lang]||e.name.en;const d=document.createElement('div');d.className='tl-era';d.id='tl-'+i;d.onclick=()=>jumpToEra(i);d.innerHTML=`<div class="tl-dot" style="background:${e.color}"></div><div class="tl-name">${name}</div>`;tl.appendChild(d);});
}
function updateTimeline(idx){
  document.querySelectorAll('.tl-era').forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.querySelectorAll('.tl-name').forEach((el,i)=>el.classList.toggle('active',i===idx));
  const el=document.getElementById('tl-'+idx);if(el)el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function loop(ts){
  if(lastTimestamp===null)lastTimestamp=ts;
  const ds=Math.min((ts-lastTimestamp)/1000,0.2);lastTimestamp=ts;
  updateSim(ds);
  drawMacro(clockT);
  drawWorldMap(clockT);
  drawPlanetIcon(clockT);
  typewriterTick(ds);
  drawCompanionAvatar(clockT);
  updateUI();
  requestAnimationFrame(loop);
}

initState(0);initOffset();initMacroStars();initMacroParticles();initRainDrops();buildTimeline();renderComposition();
document.getElementById('companion-name').textContent=COMPANIONS[currentChar].name;
startTyping(COMPANIONS[currentChar].lines[lang][0]);
applyLang();
renderLog();
requestAnimationFrame(loop);
</script>
