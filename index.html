<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth Evolution Simulator</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#000;color:#7ec8e3;font-family:'Courier New',monospace;overflow:hidden;display:flex;align-items:center;justify-content:center}
    
    #root{
        width:960px;height:640px;
        background:#02070f;
        border:4px solid #0a1f3a;
        box-shadow:0 0 40px rgba(26,82,118,0.6);
        position:relative;
        overflow:hidden;
    }
    
    #main{display:flex;height:100%}
    
    /* LEFT - MACRO CROSS SECTION */
    #macro-container{
        width:420px;
        background:#01050a;
        position:relative;
        border-right:3px solid #0a1f3a;
        overflow:hidden;
    }
    #macro{
        width:100%;
        height:100%;
        background:linear-gradient(#0b1b3a 45%, #0a2a4a 48%, #0a3a6a 65%, #051833 100%);
        position:relative;
    }
    
    /* RIGHT PANEL */
    #right{
        flex:1;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }
    
    .panel{
        padding:8px 12px;
        border-bottom:1px solid #0a1f3a;
        background:rgba(10,30,55,0.6);
    }
    .ptitle{
        font-size:9px;
        letter-spacing:2px;
        color:#4a7c9e;
        margin-bottom:4px;
    }
    
    /* Small Planet */
    #small-planet{
        position:absolute;
        top:12px;
        right:18px;
        width:110px;
        height:110px;
        border:3px solid #0a1f3a;
        border-radius:50%;
        box-shadow:0 0 20px rgba(26,82,118,0.8),
                   inset 0 0 30px rgba(0,0,0,0.6);
        overflow:hidden;
        z-index:10;
    }
    
    #top-bar{
        position:absolute;
        top:0;left:0;right:0;
        height:42px;
        background:rgba(5,15,35,0.95);
        border-bottom:2px solid #1a5276;
        display:flex;
        align-items:center;
        padding:0 20px;
        z-index:20;
        gap:15px;
    }
    
    .btn{
        font-size:9px;
        padding:4px 10px;
        background:#0a1628;
        border:1px solid #1a5276;
        color:#7ec8e3;
        cursor:pointer;
        transition:all 0.2s;
    }
    .btn:hover{
        background:#1a3a5c;
        border-color:#7ec8e3;
    }
    .btn.active{
        background:#1a5276;
        color:#ffec27;
        border-color:#ffec27;
    }
    
    #era-info{
        font-size:13px;
        color:#ffec27;
        font-weight:bold;
        letter-spacing:1px;
        flex:1;
        text-align:center;
    }
    
    #event-log{
        position:absolute;
        bottom:8px;
        left:20px;
        right:20px;
        background:rgba(4,14,28,0.9);
        border:1px solid #1a3a5c;
        padding:6px 10px;
        font-size:9px;
        color:#ffa07a;
        min-height:22px;
        text-align:center;
        z-index:15;
    }
</style>
</head>
<body>
<div id="root">
    <div id="top-bar">
        <div style="font-size:15px;color:#ffec27;letter-spacing:2px">EARTH EVOLUTION</div>
        <div id="era-info">DEVONIAN — 419 MYA</div>
        <button onclick="toggleLang()" id="lang-btn" class="btn">ENGLISH</button>
    </div>
    
    <div id="main">
        <!-- MACRO CROSS SECTION -->
        <div id="macro-container">
            <canvas id="macro-canvas" width="420" height="640"></canvas>
            <div id="event-log">Age of Fishes! First forests emerge...</div>
        </div>
        
        <!-- RIGHT PANELS -->
        <div id="right">
            <!-- ATMOSPHERE -->
            <div class="panel">
                <div class="ptitle">ATMOSPHERE</div>
                <div id="atmo-bars"></div>
            </div>
            
            <!-- AIR (CLIMATE) -->
            <div class="panel">
                <div class="ptitle">AIR</div>
                <div id="air-info" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:9px"></div>
            </div>
            
            <!-- SMALL PLANET -->
            <div id="small-planet">
                <canvas id="planet-canvas" width="110" height="110"></canvas>
            </div>
            
            <!-- BIOSPHERE -->
            <div class="panel" style="flex:1;overflow-y:auto">
                <div class="ptitle">BIOSPHERE</div>
                <div id="bio-groups"></div>
            </div>
            
            <!-- CONTROLS -->
            <div class="panel" style="border-bottom:none">
                <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center">
                    <button onclick="triggerEvent('meteor')" class="btn">☄ METEOR</button>
                    <button onclick="triggerEvent('volcano')" class="btn">🌋 VOLCANO</button>
                    <button onclick="triggerEvent('ice')" class="btn">❄ ICE AGE</button>
                    <button onclick="triggerEvent('warm')" class="btn">☀ WARMING</button>
                    <button onclick="triggerEvent('ext')" class="btn">💀 MASS EXT</button>
                    <button onclick="resetSim()" class="btn">↺ RESET</button>
                </div>
                
                <div style="margin-top:8px;display:flex;justify-content:center;gap:6px;align-items:center">
                    <span style="font-size:9px;color:#4a7c9e">SPEED:</span>
                    <button onclick="setSpeed(1)" id="spd1" class="btn active">1x</button>
                    <button onclick="setSpeed(5)" id="spd5" class="btn">5x</button>
                    <button onclick="setSpeed(20)" id="spd20" class="btn">20x</button>
                    <button onclick="setSpeed(100)" id="spd100" class="btn">100x</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ================ STATE ================
let lang = 'ja';
let timeMYA = 419;
let speed = 1;
let state = {
    atmo: {N2:74, CO2:3.1, O2:17.5, H2O:2.1, CH4:0, H2:0},
    temp: 20,
    wind: {avg:38, max:75},
    pressure: 1013,
    humidity: 65,
    surface: {ocean:62, land:37, ice:1},
    bio: {
        plankton:38, bacteria:32, cyanobacteria:22, archaea:8,
        algae:30, spore_plants:30, fungi:24, lichen:8, gymnosperm:8,
        mollusks:22, crustaceans:20, echinoderms:19, trilobites:15,
        insects:8, arachnids:8
    }
};

const canvas = document.getElementById('macro-canvas');
const ctx = canvas.getContext('2d');
const pCanvas = document.getElementById('planet-canvas');
const pCtx = pCanvas.getContext('2d');

let particles = [];
let creatures = [];
let timeOfDay = 0; // 0-1

// ================ LANGUAGE ================
const texts = {
    ja: {
        title: "EARTH EVOLUTION",
        atmo: "大気組成",
        air: "AIR",
        bio: "生物圏",
        temp: "気温",
        wind: "風速",
        pressure: "気圧",
        humidity: "湿度"
    },
    en: {
        title: "EARTH EVOLUTION",
        atmo: "ATMOSPHERE",
        air: "AIR",
        bio: "BIOSPHERE",
        temp: "TEMP",
        wind: "WIND",
        pressure: "PRESSURE",
        humidity: "HUMIDITY"
    }
};

function T(key) {
    return texts[lang][key] || key;
}

// ================ DRAW MACRO CROSS SECTION ================
function drawMacro() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const w = canvas.width;
    const h = canvas.height;
    
    // SKY
    const skyHue = state.atmo.CO2 > 10 ? 10 : (state.atmo.O2 > 25 ? 200 : 210);
    const skyGrad = ctx.createLinearGradient(0, 0, 0, h*0.48);
    skyGrad.addColorStop(0, `hsl(${skyHue}, 60%, ${state.atmo.CO2 > 15 ? 25 : 65}%)`);
    skyGrad.addColorStop(1, `hsl(${skyHue}, 80%, 20%)`);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, h*0.48);
    
    // Clouds
    ctx.fillStyle = `rgba(255,255,255,${0.6 + state.humidity/300})`;
    for (let i = 0; i < 6; i++) {
        const x = (w * 0.15 * i + timeOfDay * 80) % (w + 100) - 50;
        ctx.beginPath();
        ctx.ellipse(x, 80 + Math.sin(timeOfDay*10 + i)*15, 55, 18, 0, 0, Math.PI*2);
        ctx.fill();
    }
    
    // SUN / MOON
    const sunY = 90 + Math.sin(timeOfDay * Math.PI) * 40;
    ctx.fillStyle = state.temp > 30 ? '#ffeb3b' : '#ddd';
    ctx.beginPath();
    ctx.arc(w*0.75, sunY, 22, 0, Math.PI*2);
    ctx.fill();
    
    // LAND
    ctx.fillStyle = state.temp < 0 ? '#e0f0ff' : (state.atmo.O2 > 20 ? '#1e5c2f' : '#3a6b2a');
    ctx.fillRect(0, h*0.48, w, h*0.32);
    
    // Mountains
    ctx.fillStyle = state.temp < 5 ? '#ccddee' : '#555';
    ctx.beginPath();
    ctx.moveTo(30, h*0.48);
    ctx.lineTo(90, h*0.32);
    ctx.lineTo(160, h*0.48);
    ctx.fill();
    
    // Trees / Vegetation
    const treeColor = state.atmo.O2 > 22 ? '#0f4' : '#3a2';
    for (let i = 0; i < 8; i++) {
        const tx = 50 + i * 38;
        ctx.fillStyle = treeColor;
        ctx.fillRect(tx-4, h*0.48 - 45, 8, 45); // trunk
        ctx.beginPath();
        ctx.moveTo(tx-18, h*0.48 - 55);
        ctx.lineTo(tx+18, h*0.48 - 55);
        ctx.lineTo(tx, h*0.48 - 85);
        ctx.fill();
    }
    
    // SEA
    const seaLevel = h * 0.8;
    const seaColor = state.humidity > 70 ? '#0a4a7a' : '#1e6aa8';
    ctx.fillStyle = seaColor;
    ctx.fillRect(0, seaLevel, w, h - seaLevel);
    
    // Waves
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(0, seaLevel + 12 + Math.sin(timeOfDay*12 + i*1.5)*8);
        for (let x = 0; x < w; x += 25) {
            ctx.lineTo(x, seaLevel + 12 + Math.sin(timeOfDay*12 + x/30 + i)*8);
        }
        ctx.stroke();
    }
    
    // Creatures
    drawCreatures();
    
    // Seabed
    ctx.fillStyle = '#1a3a2a';
    ctx.fillRect(0, h*0.92, w, h*0.08);
}

// Simple creature system
function createCreatures() {
    creatures = [];
    // Plankton / small floaters
    for (let i = 0; i < Math.floor(state.bio.plankton / 4); i++) {
        creatures.push({
            type: 'plankton',
            x: Math.random()*canvas.width,
            y: canvas.height*0.55 + Math.random()*canvas.height*0.3,
            vx: (Math.random()-0.5)*0.6,
            size: 4
        });
    }
    // Fish
    for (let i = 0; i < Math.floor(state.bio.mollusks / 6); i++) {
        creatures.push({
            type: 'fish',
            x: Math.random()*canvas.width,
            y: canvas.height*0.75 + Math.random()*40,
            vx: 1.2 + Math.random()*1.5,
            size: 9
        });
    }
}

function drawCreatures() {
    creatures.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        
        if (c.type === 'plankton') {
            ctx.fillStyle = '#7dd3fc';
            ctx.beginPath();
            ctx.arc(0, 0, c.size, 0, Math.PI*2);
            ctx.fill();
            c.x += c.vx;
            c.y += Math.sin(timeOfDay*20 + c.x) * 0.4;
        } 
        else if (c.type === 'fish') {
            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(-c.size*1.4, -4, c.size*2.8, 8);
            // tail
            ctx.beginPath();
            ctx.moveTo(-c.size*1.4, 0);
            ctx.lineTo(-c.size*2.2, -6);
            ctx.lineTo(-c.size*2.2, 6);
            ctx.fill();
        }
        
        ctx.restore();
        
        // wrap around
        if (c.x < -30) c.x = canvas.width + 30;
        if (c.x > canvas.width + 30) c.x = -30;
    });
}

// ================ SMALL PLANET ================
function drawSmallPlanet() {
    pCtx.clearRect(0, 0, 110, 110);
    
    // Base
    pCtx.fillStyle = state.temp > 30 ? '#9c4a2b' : '#1e7a4a';
    pCtx.beginPath();
    pCtx.arc(55, 55, 48, 0, Math.PI*2);
    pCtx.fill();
    
    // Ocean tint
    pCtx.fillStyle = 'rgba(30, 100, 180, 0.5)';
    pCtx.beginPath();
    pCtx.arc(55, 55, 48, 0, Math.PI*2);
    pCtx.fill();
    
    // Ice caps
    if (state.surface.ice > 5) {
        pCtx.fillStyle = 'rgba(230,245,255,0.85)';
        pCtx.fillRect(15, 18, 80, 14);
        pCtx.fillRect(15, 78, 80, 12);
    }
}

// ================ UI UPDATES ================
function updateUI() {
    // Atmosphere bars
    let html = '';
    const gases = [
        {k:'N2', c:'#7ec8e3', l:'N₂'},
        {k:'CO2', c:'#ff6666', l:'CO₂'},
        {k:'O2', c:'#7cff7c', l:'O₂'},
        {k:'H2O', c:'#87cefa', l:'H₂O'},
        {k:'CH4', c:'#ffcc44', l:'CH₄'}
    ];
    
    gases.forEach(g => {
        const v = state.atmo[g.k] || 0;
        html += `
            <div style="display:flex;align-items:center;gap:6px;margin:3px 0">
                <span style="width:28px;font-size:10px">${g.l}</span>
                <div style="flex:1;height:6px;background:#0a1f3a">
                    <div style="height:100%;width:${Math.min(100, v*1.4)}%;background:${g.c}"></div>
                </div>
                <span style="width:42px;text-align:right;font-size:10px">${v.toFixed(1)}%</span>
            </div>`;
    });
    document.getElementById('atmo-bars').innerHTML = html;
    
    // Air panel
    const airHTML = `
        <div><span style="color:#ffeb3b">${T('temp')}</span><br><b style="font-size:15px">${Math.round(state.temp)}°C</b></div>
        <div><span style="color:#7ec8e3">${T('wind')}</span><br><b>${state.wind.avg} / ${state.wind.max}</b></div>
        <div><span style="color:#a0d8ff">${T('pressure')}</span><br><b>${state.pressure} hPa</b></div>
        <div><span style="color:#87cefa">${T('humidity')}</span><br><b>${state.humidity}%</b></div>
    `;
    document.getElementById('air-info').innerHTML = airHTML;
    
    // Biosphere (simplified)
    const bioDiv = document.getElementById('bio-groups');
    bioDiv.innerHTML = `
        <div style="font-size:9px;margin-bottom:4px;color:#4a7c9e">MICROBES</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
            <span>🦠 ${Math.round(state.bio.bacteria)}%</span>
            <span>🌀 ${Math.round(state.bio.plankton)}%</span>
        </div>
        <div style="font-size:9px;margin:8px 0 4px;color:#4a7c9e">PLANTS</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
            <span>🌿 ${Math.round(state.bio.spore_plants)}%</span>
            <span>🌲 ${Math.round(state.bio.gymnosperm)}%</span>
        </div>
        <div style="font-size:9px;margin:8px 0 4px;color:#4a7c9e">ANIMALS</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
            <span>🐟 ${Math.round(state.bio.mollusks)}%</span>
            <span>🦀 ${Math.round(state.bio.crustaceans)}%</span>
            <span>🪲 ${Math.round(state.bio.insects)}%</span>
        </div>
    `;
    
    drawMacro();
    drawSmallPlanet();
}

function animate() {
    timeOfDay = (Date.now() / 8000) % 1;
    drawMacro();
    requestAnimationFrame(animate);
}

// ================ EVENTS ================
function triggerEvent(type) {
    const log = document.getElementById('event-log');
    
    if (type === 'meteor') {
        state.temp += 12;
        state.atmo.CO2 += 8;
        log.textContent = '☄ 大隕石衝突！大気乱れ...';
    } else if (type === 'volcano') {
        state.atmo.CO2 += 15;
        state.temp += 9;
        log.textContent = '🌋 大規模火山活動！CO₂急増';
    } else if (type === 'ice') {
        state.temp -= 18;
        state.surface.ice = Math.min(90, state.surface.ice + 25);
        log.textContent = '❄ 氷河期到来...';
    } else if (type === 'warm') {
        state.temp += 14;
        state.surface.ice = Math.max(0, state.surface.ice - 15);
        log.textContent = '☀ 急激な温暖化';
    } else if (type === 'ext') {
        log.textContent = '💀 大量絶滅イベント！';
    }
    
    setTimeout(() => {
        log.textContent = '惑星が生きている...';
    }, 2800);
    
    updateUI();
}

function setSpeed(s) {
    speed = s;
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    document.getElementById('spd' + s).classList.add('active');
}

function resetSim() {
    timeMYA = 4500;
    state = {
        atmo: {N2:15, CO2:80, O2:0, H2O:4, CH4:0, H2:1},
        temp: 230,
        wind: {avg:280, max:420},
        pressure: 980,
        humidity: 15,
        surface: {ocean:5, land:35, ice:0},
        bio: {plankton:0, bacteria:60, cyanobacteria:5, archaea:35, algae:0, spore_plants:0, fungi:0, lichen:0, gymnosperm:0, mollusks:0, crustaceans:0, echinoderms:0, trilobites:0, insects:0, arachnids:0}
    };
    document.getElementById('event-log').textContent = '地球誕生 — 46億年前';
    updateUI();
}

function toggleLang() {
    lang = lang === 'ja' ? 'en' : 'ja';
    document.getElementById('lang-btn').textContent = lang === 'ja' ? 'ENGLISH' : '日本語';
    updateUI();
}

// ================ INIT ================
createCreatures();
updateUI();
animate();

// Simulate slow evolution
setInterval(() => {
    if (Math.random() < 0.3) {
        state.atmo.O2 = Math.min(35, state.atmo.O2 + 0.3);
        state.bio.spore_plants = Math.min(60, state.bio.spore_plants + 1);
        updateUI();
    }
}, 2200);
</script>
</body>
</html>
