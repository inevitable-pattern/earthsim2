<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth History Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* ベースサイズ: 900x620px を中央に置き、画面に合わせてスケール */
#scale-root{
  width:900px;height:620px;
  transform-origin:center center;
  position:relative;
}
#wrap{display:flex;gap:0;width:900px;height:620px;background:#000;font-family:'Courier New',monospace}
#left{width:340px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:10px;gap:6px}
#globe-wrap{position:relative;width:300px;height:300px}
canvas#globe{border-radius:50%;display:block}
canvas#overlay{position:absolute;top:0;left:0;border-radius:50%;pointer-events:none}
#top-row{display:flex;align-items:center;gap:6px;width:100%;justify-content:center}
#era-badge{font-size:13px;color:#ffec27;letter-spacing:1px;text-align:center;font-weight:bold;flex:1}
#lang-btn{font-family:'Courier New',monospace;font-size:9px;padding:2px 7px;background:#0a1628;color:#ffec27;border:1px solid #ffec27;cursor:pointer;flex-shrink:0}
#lang-btn:hover{background:#1a3a5c}
#eon-badge{font-size:9px;color:#7ec8e3;text-align:center;min-height:14px}
#event-log{width:100%;font-size:8px;color:#ffa07a;min-height:24px;text-align:center;line-height:1.4;padding:2px 4px;background:#040e1c;border:1px solid #1a3a5c}
#btns{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.ebtn{font-family:'Courier New',monospace;font-size:9px;padding:3px 7px;background:#0a1628;color:#7ec8e3;border:1px solid #1a3a5c;cursor:pointer}
.ebtn:hover{background:#1a3a5c;color:#fff}
#speed-row{display:flex;align-items:center;gap:4px;font-size:9px;color:#7ec8e3;flex-wrap:wrap;justify-content:center}
#speed-row button{font-family:'Courier New',monospace;font-size:9px;padding:2px 7px;background:#0a1628;color:#aaa;border:1px solid #1a3a5c;cursor:pointer}
#speed-row button.active{background:#1a5276;color:#ffec27;border-color:#ffec27}
#progress-outer{width:100%;height:8px;background:#040e1c;border:1px solid #1a3a5c;position:relative}
#progress-bar{height:100%;background:#1a5276;width:0%}
#progress-label{position:absolute;right:3px;top:0;font-size:7px;color:#4a7c9e;line-height:8px}
#year-display{font-size:9px;color:#4a7c9e;text-align:center}
#right{flex:1;display:flex;flex-direction:column;overflow:hidden;border-left:1px solid #1a3a5c}
.panel{padding:5px 10px;border-bottom:1px solid #0d2137}
.ptitle{font-size:8px;color:#4a7c9e;letter-spacing:2px;margin-bottom:3px}
.gas-row{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.gas-label{font-size:9px;color:#7ec8e3;width:36px}
.bar-bg{flex:1;height:5px;background:#071525}
.bar-fill{height:5px}
.gas-val{font-size:9px;width:40px;text-align:right}
.env-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
.ec{background:#071525;padding:3px 5px;border:1px solid #0d2137}
.ec-label{font-size:7px;color:#4a7c9e;letter-spacing:1px}
.ec-val{font-size:12px;font-weight:bold}
#bio-section{flex:1;overflow-y:auto;padding:5px 10px}
.bio-group{margin-bottom:5px}
.bio-group-title{font-size:7px;color:#4a7c9e;letter-spacing:1px;margin-bottom:2px;border-bottom:1px solid #0d2137;padding-bottom:1px}
.bio-row{display:flex;align-items:center;gap:3px;margin-bottom:1px}
.bio-icon{font-size:10px;width:14px;text-align:center}
.bio-name{font-size:8px;color:#7ec8e3;width:80px;white-space:nowrap;overflow:hidden}
.bio-val{font-size:8px;width:26px;text-align:right}
#timeline{padding:4px 6px 4px;background:#040e1c;border-top:1px solid #0d2137;overflow-x:auto;flex-shrink:0}
#timeline::-webkit-scrollbar{height:4px;background:#040e1c}
#timeline::-webkit-scrollbar-thumb{background:#1a3a5c;border-radius:2px}
.tl-inner{display:flex;gap:2px;align-items:flex-end;width:max-content;padding-bottom:2px}
.tl-era{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:3px 4px;border-radius:2px;flex-shrink:0}
.tl-era:hover{background:#0d2137}
.tl-era.active{background:#1a3a5c}
.tl-dot{width:8px;height:8px;border-radius:50%;margin-bottom:3px;flex-shrink:0}
.tl-name{font-size:9px;color:#4a7c9e;text-align:center;writing-mode:vertical-lr;height:60px;line-height:1.2;overflow:hidden;letter-spacing:1px}
.tl-era.active .tl-name{color:#ffec27}
/* 最終時代の停止表示 */
#end-banner{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);border:1px solid #ffec27;padding:12px 20px;font-size:10px;color:#ffec27;text-align:center;font-family:'Courier New',monospace;z-index:10;pointer-events:none;line-height:1.8}
</style>
</head>
<body>
<div id="scale-root">
<div id="wrap">
<div id="left">
  <div id="top-row">
    <div id="era-badge">EARTH SIMULATOR</div>
    <button id="lang-btn" onclick="toggleLang()">日本語</button>
  </div>
  <div id="eon-badge">HADEAN — 4.5 BYA</div>
  <div id="globe-wrap">
    <canvas id="globe" width="300" height="300"></canvas>
    <canvas id="overlay" width="300" height="300"></canvas>
    <div id="end-banner"></div>
  </div>
  <div id="progress-outer">
    <div id="progress-bar"></div>
    <span id="progress-label">0%</span>
  </div>
  <div id="year-display">4,500 MYA ago</div>
  <div id="event-log">Earth forms from cosmic dust...</div>
  <div id="btns">
    <button class="ebtn" id="btn-meteor" onclick="doEvent('meteor')">☄ METEOR</button>
    <button class="ebtn" id="btn-volcano" onclick="doEvent('volcano')">🌋 VOLCANO</button>
    <button class="ebtn" id="btn-ice" onclick="doEvent('ice')">❄ ICE AGE</button>
    <button class="ebtn" id="btn-warm" onclick="doEvent('warm')">☀ WARMING</button>
    <button class="ebtn" id="btn-ext" onclick="doEvent('mass_ext')">💀 MASS EXT</button>
    <button class="ebtn" id="btn-reset" onclick="resetSim()">↺ RESET</button>
  </div>
  <div id="speed-row">
    <span id="lbl-speed">SPEED:</span>
    <button id="b1" onclick="setSpd(1)" class="active">1x</button>
    <button id="b5" onclick="setSpd(5)">5x</button>
    <button id="b20" onclick="setSpd(20)">20x</button>
    <button id="b100" onclick="setSpd(100)">100x</button>
  </div>
</div>
<div id="right">
  <div class="panel">
    <div class="ptitle" id="lbl-atmo">ATMOSPHERE</div>
    <div id="atmo-bars"></div>
  </div>
  <div class="panel">
    <div class="ptitle" id="lbl-climate">CLIMATE</div>
    <div class="env-grid" id="env-grid"></div>
  </div>
  <div id="bio-section">
    <div class="ptitle" id="lbl-bio" style="margin-bottom:4px">BIOSPHERE</div>
    <div id="bio-groups"></div>
  </div>
  <div id="timeline">
    <div class="tl-inner" id="tl-inner"></div>
  </div>
</div>
</div>
</div>

<script>
// ---- 自動スケール ----
function autoScale(){
  const root=document.getElementById('scale-root');
  const W=900,H=620;
  const scaleX=window.innerWidth/W;
  const scaleY=window.innerHeight/H;
  const scale=Math.min(scaleX,scaleY)*0.98;
  root.style.transform=`scale(${scale})`;
  // 親をフレックスセンタリングしているので位置調整不要
}
window.addEventListener('resize',autoScale);
autoScale();

// ---- 言語 ----
const LANG={
  en:{title:'EARTH SIMULATOR',langBtn:'日本語',speed:'SPEED:',atmo:'ATMOSPHERE',climate:'CLIMATE',bio:'BIOSPHERE',temp:'TEMP',wind:'WIND',ice:'ICE',ago:' ago',reborn:'Present day — Earth continues...',reset_msg:'Earth reset — 4.5 billion years begin',btn_meteor:'☄ METEOR',btn_volcano:'🌋 VOLCANO',btn_ice:'❄ ICE AGE',btn_warm:'☀ WARMING',btn_ext:'💀 MASS EXT',btn_reset:'↺ RESET',ev_meteor:'☄ METEOR IMPACT! Mass extinction event!',ev_volcano:'🌋 MASSIVE VOLCANISM! CO2 surges, O2 drops!',ev_ice:'❄ ICE AGE! Global cooling. Life struggles!',ev_warm:'☀ GLOBAL WARMING! Ice melts. Ocean rises!',ev_ext:'💀 MASS EXTINCTION! 90% of species wiped out!',grp_microbe:'MICROBES',grp_plant:'PLANTS & ALGAE',grp_invert:'INVERTEBRATES',grp_vert:'VERTEBRATES',end_title:'PRESENT DAY',end_sub:'Simulation complete — Earth endures',magma:'Magma',ocean:'Ocean',land:'Land',ice_s:'Ice'},

};
let lang='en';
function T(k){return LANG[lang][k]||LANG.en[k]||k;}
function toggleLang(){lang=lang==='en'?'ja':'en';applyLang();}
function applyLang(){
  document.getElementById('era-badge').textContent=T('title');
  document.getElementById('lang-btn').textContent=T('langBtn');
  document.getElementById('lbl-speed').textContent=T('speed');
  document.getElementById('lbl-atmo').textContent=T('atmo');
  document.getElementById('lbl-climate').textContent=T('climate');
  document.getElementById('lbl-bio').textContent=T('bio');
  ['meteor','volcano','ice','warm','ext','reset'].forEach(k=>{const b=document.getElementById('btn-'+k);if(b)b.textContent=T('btn_'+k);});
  buildTimeline();updateTimeline(curEraIdx);
}

const ERA_NAMES={hadean:{en:'Hadean',ja:'冥王代'},archean:{en:'Archean',ja:'太古代'},proterozoic:{en:'Proterozoic',ja:'原生代'},snowball:{en:'Snowball Earth',ja:'全球凍結'},ediacaran:{en:'Ediacaran',ja:'エディアカラ紀'},cambrian:{en:'Cambrian',ja:'カンブリア紀'},ordovician:{en:'Ordovician',ja:'オルドビス紀'},silurian:{en:'Silurian',ja:'シルル紀'},devonian:{en:'Devonian',ja:'デボン紀'},carboniferous:{en:'Carbonifer.',ja:'石炭紀'},permian:{en:'Permian',ja:'ペルム紀'},pt_ext:{en:'P-T Extinct.',ja:'P-T大絶滅'},triassic_e:{en:'Triassic E.',ja:'三畳紀前期'},triassic_l:{en:'Triassic L.',ja:'三畳紀後期'},jurassic_e:{en:'Jurassic E.',ja:'ジュラ紀前期'},jurassic_l:{en:'Jurassic L.',ja:'ジュラ紀後期'},cretaceous_e:{en:'Cretac. E.',ja:'白亜紀前期'},cretaceous_l:{en:'Cretac. L.',ja:'白亜紀後期'},kpg_ext:{en:'K-Pg Extinct.',ja:'K-Pg大絶滅'},paleogene:{en:'Paleogene',ja:'暁新世'},neogene:{en:'Neogene',ja:'中新世'},quaternary:{en:'Quaternary',ja:'第四紀'}};
const ERA_DESC={hadean:{en:'Molten Earth. Meteor bombardment. No life possible.',ja:'溶融した地球。隕石の集中砲火。生命不可能。'},archean:{en:'First oceans & primitive bacteria. Zero oxygen.',ja:'最初の海と原始細菌。酸素はゼロ。'},proterozoic:{en:'Great Oxidation Event! Cyanobacteria flood atmosphere with O2.',ja:'大酸化イベント！シアノバクテリアがO2を放出。'},snowball:{en:'SNOWBALL EARTH — entire planet frozen! Life clings to vents.',ja:'全球凍結！惑星全体が氷に覆われる！'},ediacaran:{en:'First multicellular life! Soft-bodied Ediacaran fauna emerge.',ja:'最初の多細胞生物！エディアカラ生物群が出現。'},cambrian:{en:'Cambrian Explosion! Most animal phyla appear. Trilobites dominate.',ja:'カンブリア爆発！ほとんどの動物門が出現。三葉虫が支配。'},ordovician:{en:'Marine life diversifies. First land plants. Ends with mass extinction.',ja:'海洋生物が多様化。最初の陸上植物。大量絶滅で終わる。'},silurian:{en:'First vascular plants. Jawed fish evolve. Coral reefs flourish.',ja:'最初の維管束植物。顎を持つ魚が進化。'},devonian:{en:'Age of Fishes! First forests. Tetrapods crawl onto land.',ja:'魚の時代！最初の森林。四肢動物が陸上へ。'},carboniferous:{en:'O2 hits 30%! Giant insects. Coal swamp forests.',ja:'O2が30%！巨大昆虫。石炭紀の森林。'},permian:{en:'Pangaea. Synapsids dominate. End: WORST mass extinction.',ja:'パンゲア。単弓類が支配。最悪の大量絶滅。'},pt_ext:{en:'96% of all species EXTINCT. Siberian Traps erupt.',ja:'全種の96%が絶滅。シベリアの罠噴火。'},triassic_e:{en:'Recovery begins. First dinosaurs! Archosaurs diversify.',ja:'回復開始。最初の恐竜！主竜類が急速に多様化。'},triassic_l:{en:'Dinosaurs diversify. First true mammals. Pangaea splits.',ja:'恐竜が多様化。最初の哺乳類。パンゲアが分裂。'},jurassic_e:{en:'Sauropods grow enormous. Atlantic Ocean opens.',ja:'竜脚類が巨大化。大西洋が開く。'},jurassic_l:{en:'Peak Jurassic! Brachiosaurus, Stegosaurus. First birds!',ja:'ジュラ紀の頂点！最初の鳥！'},cretaceous_e:{en:'Flowering plants explode. Sea levels very high.',ja:'被子植物が大陸に広まる。海面が高い。'},cretaceous_l:{en:'T-Rex! Triceratops! Angiosperms dominant. Asteroid incoming...',ja:'T-レックス！トリケラトプス！小惑星が近づく…'},kpg_ext:{en:'Chicxulub impact! 75% species extinct. Dinos gone.',ja:'チクシュルーブ衝突！種の75%が絶滅。恐竜消滅。'},paleogene:{en:'Mammals explode! Whales return to sea. Primates appear.',ja:'哺乳類が爆発的 const TOTAL_MYA=4500,REAL_SECONDS_1X=300*60,MYA_PER_SEC_1X=TOTAL_MYA/REAL_SECONDS_1X;

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function getEraIdx(mya){for(let i=0;i<ERAS.length;i++){if(mya<=ERAS[i].mya&&mya>ERAS[i].endMya)return i;}return ERAS.length-1;}
function initOffset(){const bio={};bioKeys().forEach(k=>bio[k]=0);offset={temp:0,co2:0,o2:0,iceRatio:0,bio};}
function initState(eIdx){const e=ERAS[eIdx||0];const bio={};bioKeys().forEach(k=>bio[k]=e.bio[k]||0);const sf=e.surface||ERA_SURFACE.hadean;state={atmo:{...e.atmo},temp:e.temp,surface:{magma:sf.magma,ocean:sf.ocean,land:sf.land,ice:sf.ice,windAvg:sf.windAvg,windMax:sf.windMax},clouds:e.clouds,snowball:e.snowball,gc:e.gc,bio};}

  } else {
    b.style.display='none';
  }
}

function updateSim(ds){
  if(simEnded) return; // 終了後は進めない

  simMya-=MYA_PER_SEC_1X*spd*ds;

  // 最終時代(Quaternary)の末端 = simMya <= 0 で停止
  if(simMya<=0){
    simMya=0;
    simEnded=true;
    setEvent(T('reborn'));
    showEndBanner(true);
    // Quaternaryの状態に固定
    const lastE=ERAS[ERAS.length-1];
    curEraIdx=ERAS.length-1;
    updateTimeline(curEraIdx);
    document.getElementById('eon-badge').textContent=(lastE.name[lang]||lastE.name.en).toUpperCase()+' — PRESENT';
    return;
  }

  const eIdx=getEraIdx(simMya);curEraIdx=eIdx;const e=ERAS[eIdx];
  const eraDurSec=(e.mya-e.endMya)/(MYA_PER_SEC_1X*spd);
  const tau=Math.max(eraDurSec*0.18,0.8);
  const blend=clamp(1-Math.exp(-ds/tau),0,0.4);
  Object.keys(e.atmo).forEach(k=>state.atmo[k]=lerp(state.atmo[k]||0,e.atmo[k],blend));
  state.atmo.CO2=clamp(state.atmo.CO2+offset.co2*0.01,0,90);
  state.atmo.O2=clamp(state.atmo.O2+offset.o2*0.01,0,40);
  state.temp=lerp(state.temp,e.temp+offset.temp,blend);
  const sf=e.surface||ERA_SURFACE.hadean;
  state.surface.magma =lerp(state.surface.magma, sf.magma, blend);
  state.surface.ocean =lerp(state.surface.ocean, sf.ocean, blend);
  state.surface.land  =lerp(state.surface.land,  sf.land,  blend);
  state.surface.ice   =lerp(state.surface.ice,   clamp(sf.ice+offset.iceRatio*100,0,100), blend);
  state.surface.windAvg=lerp(state.surface.windAvg,sf.windAvg,blend);
  state.surface.windMax=lerp(state.surface.windMax,sf.windMax,blend);
  state.clouds=lerp(state.clouds,e.clouds,blend);
  state.gc=e.gc;state.snowball=e.snowball||(state.surface.ice>80);
  bioKeys().forEach(k=>{const tgt=clamp((e.bio[k]||0)+(offset.bio[k]||0),0,100);state.bio[k]=lerp(state.bio[k]||0,tgt,blend);});
  const df=Math.exp(-ds/90);
  offset.temp*=df;offset.co2*=df;offset.o2*=df;offset.iceRatio*=df;
  bioKeys().forEach(k=>offset.bio[k]*=df);
  cloudAngle+=ds*0.04*(state.surface.windAvg/100);
  cloudParticles.forEach(p=>p.angle+=p.speed*ds*60);
  if(meteorActive){meteorY+=meteorVY*ds*60;if(meteorY>290)meteorActive=false;}
  if(eIdx!==lastEraIdx){
    lastEraIdx=eIdx;
    setEvent(e.desc[lang]||e.desc.en);
    document.getElementById('eon-badge').textContent=(e.name[lang]||e.name.en).toUpperCase()+' — '+(e.mya>=1000?(e.mya/1000).toFixed(1)+(lang==='ja'?'十億年前':' BYA'):e.mya+(lang==='ja'?'百万年前':' MYA'));
    updateTimeline(eIdx);
  }
}

function doEvent(type){
  if(simEnded){simEnded=false;showEndBanner(false);} // イベントで再開
  if(type==='meteor'){meteorActive=true;meteorX=Math.random()*260+20;meteorY=20;meteorVY=3+Math.random()*2;offset.temp+=25;offset.co2+=18;bioKeys().forEach(k=>{if(!['bacteria','fungi','archaea','cyanobact'].includes(k))offset.bio[k]-=20;});offset.bio.bacteria+=8;offset.bio.fungi+=10;setEvent(T('ev_meteor'));}
  else if(type==='volcano'){offset.temp+=18;offset.co2+=25;offset.o2-=6;setEvent(T('ev_volcano'));}
  else if(type==='ice'){offset.temp-=35;offset.iceRatio+=0.7;bioKeys().forEach(k=>{if(!['bacteria','archaea','cyanobact'].includes(k))offset.bio[k]-=15;});setEvent(T('ev_ice'));}
  else if(type==='warm'){offset.temp+=25;offset.co2+=12;offset.iceRatio-=0.5;setEvent(T('ev_warm'));}
  else if(type==='mass_ext'){bioKeys().forEach(k=>{if(!['bacteria','fungi','archaea','cyanobact'].includes(k))offset.bio[k]-=45;});offset.bio.bacteria+=15;offset.bio.fungi+=20;offset.temp+=12;setEvent(T('ev_ext'));}
}

function setEvent(msg){const el=document.getElementById('event-log');if(el)el.textContent=msg;}
function setSpd(s){spd=s;[1,5,20,100].forEach(v=>{const b=document.getElementById('b'+v);if(b)b.classList.toggle('active',v===s);});}

function resetSim(){
  simMya=TOTAL_MYA;lastEraIdx=-1;curEraIdx=0;lastTimestamp=null;simEnded=false;
  showEndBanner(false);
  initOffset();initState(0);
  setEvent(T('reset_msg'));
  document.getElementById('eon-badge').textContent=(lang==='ja'?'冥王代':'HADEAN')+' — 4.5 BYA';
  updateTimeline(0);
}

function jumpToEra(idx){
  const e=ERAS[idx];simMya=e.mya-(e.mya-e.endMya)*0.05;
  simEnded=false;showEndBanner(false);
  initState(idx);initOffset();lastEraIdx=idx;curEraIdx=idx;lastTimestamp=null;
  setEvent(e.desc[lang]||e.desc.en);
  document.getElementById('eon-badge').textContent=(e.name[lang]||e.name.en).toUpperCase()+' — '+(e.mya>=1000?(e.mya/1000).toFixed(1)+(lang==='ja'?'十億年前':' BYA'):e.mya+(lang==='ja'?'百万年前':' MYA'));
  updateTimeline(idx);
}

// Globe
const gcv=document.getElementById('globe'),gctx=gcv.getContext('2d');
const ocv=document.getElementById('overlay'),octx=ocv.getContext('2d');
const R=148,CX=150,CY=150;let _stars=null;
function initClouds(){cloudParticles=[];for(let i=0;i<20;i++)cloudParticles.push({angle:Math.random()*Math.PI*2,lat:(Math.random()-0.5)*1.4,size:Math.random()*16+7,speed:(Math.random()*0.003+0.001)*(Math.random()<0.5?1:-1),alpha:Math.random()*0.35+0.25});}
function lighten(hex,a){const n=parseInt(hex.replace('#',''),16);return `rgb(${Math.min(255,((n>>16)&255)+a)},${Math.min(255,((n>>8)&255)+a)},${Math.min(255,(n&255)+a)})`;}
function darken(hex,a){const n=parseInt(hex.replace('#',''),16);return `rgb(${Math.max(0,((n>>16)&255)-a)},${Math.max(0,((n>>8)&255)-a)},${Math.max(0,(n&255)-a)})`;}

function drawGlobe(){
  gctx.clearRect(0,0,300,300);octx.clearRect(0,0,300,300);
  gctx.fillStyle='#000';gctx.fillRect(0,0,300,300);
  if(!_stars){_stars=[];for(let i=0;i<80;i++)_stars.push([Math.random()*300,Math.random()*300,Math.random()*1.2+0.3]);}
  _stars.forEach(([x,y,r])=>{gctx.fillStyle='rgba(255,255,255,0.5)';gctx.beginPath();gctx.arc(x,y,r,0,Math.PI*2);gctx.fill();});
  const grad=gctx.createRadialGradient(CX-45,CY-45,15,CX,CY,R);
  if(state.snowball){grad.addColorStop(0,'#eaf4fd');grad.addColorStop(0.5,'#aed6f1');grad.addColorStop(1,'#5dade2');}
  else{grad.addColorStop(0,lighten(state.gc||'#1a5276',45));grad.addColorStop(0.6,state.gc||'#1a5276');grad.addColorStop(1,darken(state.gc||'#1a5276',40));}
  gctx.beginPath();gctx.arc(CX,CY,R,0,Math.PI*2);gctx.fillStyle=grad;gctx.fill();
  if(!state.snowball&&state.surface.ocean>10){
    gctx.save();gctx.beginPath();gctx.arc(CX,CY,R,0,Math.PI*2);gctx.clip();
    for(let i=0;i<5;i++){const ox=CX+Math.cos(i*1.26+cloudAngle*0.25)*55,oy=CY+Math.sin(i*1.7+cloudAngle*0.18)*48,or=28+state.surface.ocean*0.48+Math.sin(i*2.1)*12;gctx.beginPath();gctx.arc(ox,oy,or,0,Math.PI*2);gctx.fillStyle=`rgba(41,128,185,${0.28+state.surface.ocean*0.0028})`;gctx.fill();}
    gctx.restore();
  }
  if(state.surface.ice>1){
    gctx.save();gctx.beginPath();gctx.arc(CX,CY,R,0,Math.PI*2);gctx.clip();
    const ih=state.surface.ice/100*R*1.9;
    gctx.fillStyle=`rgba(210,235,255,${0.65+state.surface.ice/100*0.3})`;
    gctx.beginPath();gctx.ellipse(CX,CY-R+ih/2,R*0.65*state.surface.ice/100+18,ih/2,0,0,Math.PI*2);gctx.fill();
    gctx.beginPath();gctx.ellipse(CX,CY+R-ih/2,R*0.65*state.surface.ice/100+18,ih/2,0,0,Math.PI*2);gctx.fill();
    if(state.snowball){gctx.fillStyle='rgba(215,238,255,0.9)';gctx.beginPath();gctx.arc(CX,CY,R,0,Math.PI*2);gctx.fill();}
    gctx.restore();
  }
  const o2f=clamp((state.atmo.O2||0)/25,0,1),co2f=clamp((state.atmo.CO2||0)/20,0,1);
  const ag=gctx.createRadialGradient(CX,CY,R-4,CX,CY,R+20);
  ag.addColorStop(0,`rgba(${Math.round(80+co2f*160)},${Math.round(140+o2f*90)},${Math.round(210-co2f*90)},0.65)`);ag.addColorStop(1,'rgba(0,0,0,0)');
  gctx.beginPath();gctx.arc(CX,CY,R+20,0,Math.PI*2);gctx.fillStyle=ag;gctx.fill();
  octx.save();octx.beginPath();octx.arc(CX,CY,R,0,Math.PI*2);octx.clip();
  cloudParticles.forEach(p=>{const px=CX+Math.cos(p.angle)*R*0.8*Math.cos(p.lat),py=CY+Math.sin(p.lat)*R*0.8,depth=Math.cos(p.angle)*Math.cos(p.lat);if(depth>-0.1){const alpha=p.alpha*state.clouds*(0.4+depth*0.6);octx.fillStyle=`rgba(235,245,255,${alpha})`;octx.beginPath();octx.ellipse(px,py,p.size*(0.6+depth*0.4),p.size*0.38*(0.6+depth*0.4),p.angle*0.2,0,Math.PI*2);octx.fill();}});
  octx.restore();
  if(meteorActive){octx.strokeStyle='rgba(255,200,80,0.9)';octx.lineWidth=2.5;octx.beginPath();octx.moveTo(meteorX-35,meteorY-35);octx.lineTo(meteorX,meteorY);octx.stroke();octx.fillStyle='rgba(255,140,40,0.95)';octx.beginPath();octx.arc(meteorX,meteorY,5,0,Math.PI*2);octx.fill();}
  const sg=gctx.createRadialGradient(CX+55,CY+45,R*0.25,CX,CY,R);sg.addColorStop(0,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(0,0,0,0.58)');gctx.beginPath();gctx.arc(CX,CY,R,0,Math.PI*2);gctx.fillStyle=sg;gctx.fill();
}

let uiTick=0;
function updateUI(){
  uiTick++;
  const pct=Math.max(0,Math.min(100,(TOTAL_MYA-simMya)/TOTAL_MYA*100));
  const pb=document.getElementById('progress-bar');if(pb)pb.style.width=pct.toFixed(2)+'%';
  const pl=document.getElementById('progress-label');if(pl)pl.textContent=pct.toFixed(1)+'%';
  const m=Math.max(0,simMya);
  const ydEl=document.getElementById('year-display');
  if(ydEl){if(lang==='ja')ydEl.textContent=(m>=1000?(m/1000).toFixed(2)+'十億年前':m.toFixed(1)+'百万年前');else ydEl.textContent=(m>=1000?(m/1000).toFixed(2)+' BYA':m.toFixed(1)+' MYA')+' ago';}
  if(uiTick%3!==0)return;
  const atmo=state.atmo,total=Object.values(atmo).reduce((a,b)=>a+(b||0),0)||1;
  let h='';GASES.forEach(g=>{const v=atmo[g.key]||0,p=v/total*100;h+=`<div class="gas-row"><span class="gas-label">${g.label}</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,p*3)}%;background:${g.color}"></div></div><span class="gas-val" style="color:${g.color}">${p.toFixed(1)}%</span></div>`;});
  document.getElementById('atmo-bars').innerHTML=h;
  const tc=state.temp>40?'#ff6b6b':state.temp<-10?'#87ceeb':'#98fb98';
  const sf2=state.surface;
  const wc='#7ec8e3';
  document.getElementById('env-grid').innerHTML=`
    <div class="ec"><div class="ec-label">${T('temp')}</div><div class="ec-val" style="color:${tc}">${Math.round(state.temp)}°C</div></div>
    <div class="ec"><div class="ec-label">${T('wind')}</div><div class="ec-val" style="color:${wc};font-size:9px">avg.${Math.round(sf2.windAvg)} max.${Math.round(sf2.windMax)}<span style="font-size:7px"> m/s</span></div></div>
    <div class="ec" style="grid-column:span 3">
      <div style="display:flex;gap:10px;justify-content:center;align-items:center">
        ${sf2.magma>0.5?`<span style="color:#ff6b6b;font-size:9px">🌋 ${T('magma')} ${Math.round(sf2.magma)}%</span>`:''}
        <span style="color:#5dade2;font-size:9px">🌊 ${T('ocean')} ${Math.round(sf2.ocean)}%</span>
        <span style="color:#82e0aa;font-size:9px">🏔 ${T('land')} ${Math.round(sf2.land)}%</span>
        ${sf2.ice>0.5?`<span style="color:#aed6f1;font-size:9px">🧊 ${T('ice_s')} ${Math.round(sf2.ice)}%</span>`:''}
      </div>
    </div>`;
  let bh='';
  BIO_GROUPS_DEF.forEach(group=>{
    const active=group.members.filter(m=>(state.bio[m.key]||0)>0.5);
    if(!active.length)return;
    // グループ内合計を母数にして biomass% を計算
    const gsum=group.members.reduce((s,m)=>s+(state.bio[m.key]||0),0)||1;
    const gmax=Math.max(...active.map(m=>state.bio[m.key]||0),1);
    const gtitle=T('grp_'+group.gkey);
    bh+=`<div class="bio-group"><div class="bio-group-title" style="display:flex;justify-content:space-between;align-items:baseline">${gtitle}<span style="font-size:6px;color:#2a4a6a;letter-spacing:0">biomass %</span></div>`;
    active.sort((a,b2)=>(state.bio[b2.key]||0)-(state.bio[a.key]||0));
    active.forEach(m=>{
      const v=state.bio[m.key]||0;
      const pct=Math.round(v/gsum*100);
      const lbl=m[lang]||m.en;
      bh+=`<div class="bio-row"><span class="bio-icon">${m.icon}</span><span class="bio-name">${lbl}</span><div class="bar-bg"><div class="bar-fill" style="width:${v/gmax*100}%;background:${m.color}"></div></div><span class="bio-val" style="color:${m.color}">${pct}%</span></div>`;
    });
    bh+='</div>';
  });
  document.getElementById('bio-groups').innerHTML=bh;
}

function buildTimeline(){
  const tl=document.getElementById('tl-inner');tl.innerHTML='';
  ERAS.forEach((e,i)=>{const name=e.name[lang]||e.name.en;const d=document.createElement('div');d.className='tl-era';d.id='tl-'+i;d.onclick=()=>jumpToEra(i);d.innerHTML=`<div class="tl-dot" style="background:${e.color}"></div><div class="tl-name">${name}</div>`;tl.appendChild(d);});
}
function updateTimeline(idx){
  document.querySelectorAll('.tl-era').forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.querySelectorAll('.tl-name').forEach((el,i)=>el.classList.toggle('active',i===idx));
  const el=document.getElementById('tl-'+idx);if(el)el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function loop(ts){
  if(lastTimestamp===null)lastTimestamp=ts;
  const ds=Math.min((ts-lastTimestamp)/1000,0.2);lastTimestamp=ts;
  updateSim(ds);drawGlobe();updateUI();
  requestAnimationFrame(loop);
}

initState(0);initOffset();initClouds();buildTimeline();
requestAnimationFrame(loop);
</script>
