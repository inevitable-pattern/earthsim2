<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plugin Manager — Earth Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#7ec8e3;font-family:'Courier New',monospace;height:100vh;overflow:hidden}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0a1628;border-bottom:1px solid #1a3a5c}
#top h1{font-size:14px;color:#4ecb71;letter-spacing:2px;flex:1}
.topbtn{font-family:'Courier New',monospace;font-size:11px;padding:5px 10px;background:#071525;color:#7ec8e3;border:1px solid #1a3a5c;cursor:pointer}
.topbtn:hover{border-color:#4ecb71;color:#4ecb71}
#body{padding:14px;overflow-y:auto;height:calc(100vh - 42px)}
.cat-title{font-size:12px;color:#ffec27;letter-spacing:1px;margin:16px 0 8px;border-bottom:1px solid #1a3a5c;padding-bottom:4px}
.cat-title:first-child{margin-top:0}
.plugin-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-bottom:1px solid #071525;font-size:11px}
.plugin-row:hover{background:#0d2137}
.plugin-name{flex:1}
.plugin-toggle{position:relative;width:38px;height:20px;background:#071525;border:1px solid #1a3a5c;cursor:pointer;flex-shrink:0}
.plugin-toggle.on{background:#0d2b12;border-color:#4ecb71}
.plugin-toggle .knob{position:absolute;top:1px;left:1px;width:16px;height:16px;background:#7ec8e3;transition:left 0.15s}
.plugin-toggle.on .knob{left:19px;background:#4ecb71}
.empty-note{font-size:10px;color:#3a5a78;padding:8px}
#note{font-size:9px;color:#4a7c9e;padding:10px 0;line-height:1.5}
</style>
</head>
<body>
<div id="top">
  <button class="topbtn" onclick="location.href='index.html'">← BACK</button>
  <h1>🔌 PLUGIN MANAGER</h1>
</div>
<div id="body">
  <div id="note">Turn saved objects/events/ages/images on or off. Disabled ones stay saved here but the game won't apply them as overrides. Changes take effect on the game's next refresh (or immediately if it's already open in another tab).</div>
  <div id="lists"></div>
</div>

<script src="editor-core.js"></script>
<script>
const CATEGORIES=[
  {ns:'objects',label:'🧬 OBJECTS'},
  {ns:'events',label:'⚡ EVENTS'},
  {ns:'ages',label:'🕰 AGES'},
  {ns:'images',label:'🖼 IMAGES'},
];

function render(){
  const root=document.getElementById('lists');
  root.innerHTML='';
  CATEGORIES.forEach(cat=>{
    let slots=[];
    try{ slots=JSON.parse(localStorage.getItem('earthsim_editor_'+cat.ns+'_slots')||'[]'); }catch(e){}
    const title=document.createElement('div');
    title.className='cat-title';
    title.textContent=cat.label;
    root.appendChild(title);
    const nonEmpty=slots.map((s,i)=>({s,i})).filter(x=>x.s && !x.s.empty);
    if(!nonEmpty.length){
      const note=document.createElement('div');
      note.className='empty-note';
      note.textContent='No saved '+cat.label.replace(/^\S+\s/,'').toLowerCase()+' yet — create some in its editor first.';
      root.appendChild(note);
      return;
    }
    nonEmpty.forEach(({s,i})=>{
      const enabled=isPluginEnabled(cat.ns,i);
      const row=document.createElement('div');
      row.className='plugin-row';
      row.innerHTML=`<span class="plugin-name">${s.name}</span><div class="plugin-toggle${enabled?' on':''}"><div class="knob"></div></div>`;
      row.querySelector('.plugin-toggle').onclick=()=>{
        const newVal=!isPluginEnabled(cat.ns,i);
        setPluginEnabled(cat.ns,i,newVal);
        render();
      };
      root.appendChild(row);
    });
  });
}
render();
</script>
</body>
</html>
