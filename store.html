<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Store — Earth Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#7ec8e3;font-family:'Courier New',monospace;height:100vh;overflow:hidden}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0a1628;border-bottom:1px solid #1a3a5c}
#top h1{font-size:14px;color:#4ecb71;letter-spacing:2px;flex:1}
.topbtn{font-family:'Courier New',monospace;font-size:11px;padding:5px 10px;background:#071525;color:#7ec8e3;border:1px solid #1a3a5c;cursor:pointer}
.topbtn:hover{border-color:#4ecb71;color:#4ecb71}
#body{padding:14px;overflow-y:auto;height:calc(100vh - 42px)}
.cat-title{font-size:12px;color:#ffec27;letter-spacing:1px;margin:16px 0 8px;border-bottom:1px solid #1a3a5c;padding-bottom:4px}
.cat-title:first-child{margin-top:0}
.item-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-bottom:1px solid #071525;font-size:11px}
.item-row:hover{background:#0d2137}
.item-name{flex:1}
.getbtn{font-family:'Courier New',monospace;font-size:10px;padding:4px 10px;background:#0d1a2b;color:#5dade2;border:1px solid #5dade2;cursor:pointer}
.getbtn:hover{filter:brightness(1.3)}
.empty-note,.err-note{font-size:10px;color:#3a5a78;padding:8px}
.err-note{color:#ff6b6b}
#note{font-size:9px;color:#4a7c9e;padding:10px 0;line-height:1.5}
#repo-line{font-size:10px;color:#7ec8e3;padding-bottom:8px}
</style>
</head>
<body>
<div id="top">
  <button class="topbtn" onclick="location.href='index.html'">← BACK</button>
  <h1>🏬 STORE</h1>
  <button class="topbtn" onclick="location.href='editor.html'">⚙ SETTINGS (in any editor)</button>
</div>
<div id="body">
  <div id="note">Browses the GitHub repo configured in SETTINGS (set it from the Object/Event/Age/Image editor first). "⬇ GET" downloads an item into the first empty local slot of the matching editor.</div>
  <div id="repo-line"></div>
  <div id="lists"></div>
</div>

<script src="editor-core.js"></script>
<script>
const CATEGORIES=[
  {ns:'objects',folder:'objects',label:'🧬 OBJECTS',ext:'.js'},
  {ns:'events',folder:'events',label:'⚡ EVENTS',ext:'.json'},
  {ns:'ages',folder:'ages',label:'🕰 AGES',ext:'.json'},
  {ns:'images',folder:'images',label:'🖼 IMAGES',ext:'.js'},
];

async function listFolder(owner,repo,path,token){
  const url=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const headers={Accept:'application/vnd.github+json'};
  if(token)headers.Authorization=`Bearer ${token}`;
  const res=await fetch(url,{headers});
  if(res.status===404)return [];
  if(!res.ok)throw new Error('GitHub error '+res.status);
  const data=await res.json();
  return Array.isArray(data)?data.filter(f=>f.type==='file'):[];
}

async function getFileContent(item,token){
  const headers={Accept:'application/vnd.github.raw'};
  if(token)headers.Authorization=`Bearer ${token}`;
  const res=await fetch(item.url,{headers});
  if(!res.ok)throw new Error('GitHub error '+res.status);
  return await res.text();
}

function importIntoSlot(ns,name,source){
  const key='earthsim_editor_'+ns+'_slots';
  let slots=[];
  try{ slots=JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){}
  if(!slots.length){ toast('Open the matching editor once first so its 100 slots are initialized.'); return false; }
  let idx=slots.findIndex(s=>!s||s.empty);
  if(idx===-1){ toast('No empty slot available in that editor — free one up first.'); return false; }
  slots[idx]={name,source,empty:false};
  try{ localStorage.setItem(key,JSON.stringify(slots)); }catch(e){}
  return idx;
}

async function render(){
  const s=getSettings();
  const repoLine=document.getElementById('repo-line');
  const root=document.getElementById('lists');
  root.innerHTML='';
  if(!s.ghRepo){
    repoLine.innerHTML='⚠ No GitHub repo configured yet. Open any editor → ⚙ SETTINGS → set "GitHub Repo".';
    return;
  }
  const [owner,repo]=s.ghRepo.split('/');
  repoLine.textContent='Repo: '+s.ghRepo+(s.ghPath?' (path prefix: '+s.ghPath+')':'');
  for(const cat of CATEGORIES){
    const title=document.createElement('div');
    title.className='cat-title';
    title.textContent=cat.label;
    root.appendChild(title);
    const path=(s.ghPath?s.ghPath.replace(/\/$/,'')+'/':'')+cat.folder;
    try{
      const files=await listFolder(owner,repo,path,s.ghToken);
      if(!files.length){
        const note=document.createElement('div');
        note.className='empty-note';
        note.textContent='Nothing published here yet.';
        root.appendChild(note);
        continue;
      }
      files.forEach(f=>{
        const row=document.createElement('div');
        row.className='item-row';
        row.innerHTML=`<span class="item-name">${f.name}</span><button class="getbtn">⬇ GET</button>`;
        row.querySelector('.getbtn').onclick=async()=>{
          try{
            toast('Downloading '+f.name+'...');
            const content=await getFileContent(f,s.ghToken);
            const name=f.name.replace(/\.[^.]+$/,'').replace(/-/g,' ');
            const idx=importIntoSlot(cat.ns,name,content);
            if(idx!==false)toast('Imported "'+name+'" into '+cat.label+' slot '+(idx+1)+'. Open its editor to view it.');
          }catch(e){ toast('⚠ '+e.message); }
        };
        root.appendChild(row);
      });
    }catch(e){
      const err=document.createElement('div');
      err.className='err-note';
      err.textContent='⚠ Could not list '+path+': '+e.message;
      root.appendChild(err);
    }
  }
}
render();
</script>
</body>
</html>
